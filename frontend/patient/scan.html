<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tap2Med | Patient Check-in</title>
</head>
<body>
    <style>
    :root {
        --primary-blue: #87ceeb; /* The light blue from your Submit button */
        --dark-text: #1a1a1a;
        --gray-text: #4a4a4a;
        --border-color: #000000;
        --bg-color: #ffffff;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: var(--bg-color);
        color: var(--dark-text);
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
        box-sizing: border-box;
    }

    #app-container {
        width: 100%;
        max-width: 400px;
        display: flex;
        flex-direction: column;
        height: 90vh; /* Keeps footer at bottom */
    }

    /* 1. Header & Logo */
    header {
        margin-top: 20px;
        text-align: center;
    }

    .logo-row {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        font-size: 1.5rem;
        font-weight: bold;
        gap: 10px;
        margin-bottom: 40px;
    }

    .logo-icon {
        color: #003366;
        font-size: 2rem;
    }

    h1 {
        font-size: 1.8rem;
        margin-bottom: 5px;
    }

    .powered-by {
        color: var(--gray-text);
        font-size: 0.9rem;
        margin-top: 0;
    }

    /* 2. Input Section */
    .main-content {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .instruction {
        font-size: 1.2rem;
        line-height: 1.4;
        margin-bottom: 30px;
        max-width: 80%;
    }

    #phone-input {
        width: 100%;
        padding: 15px;
        font-size: 1.1rem;
        border: 2px solid var(--border-color);
        border-radius: 10px;
        background-color: #e3f2fd; /* Light blue tint from mockup */
        margin-bottom: 30px;
        box-sizing: border-box;
        text-align: center;
    }

    #submit-btn {
        width: 60%;
        padding: 15px;
        background-color: var(--primary-blue);
        color: var(--dark-text);
        font-size: 1.2rem;
        font-weight: bold;
        border: 2px solid var(--border-color);
        border-radius: 10px;
        cursor: pointer;
        transition: transform 0.1s;
    }

    #submit-btn:active {
        transform: scale(0.95);
    }

    /* 3. Privacy Footer */
    footer {
        font-size: 0.85rem;
        color: var(--dark-text);
        text-align: center;
        margin-top: auto;
        padding-bottom: 20px;
        line-height: 1.4;
    }
</style>

    <header id="header">
        <div class="logo-container">
            <span id="logo-icon">✚</span> <strong>Tap2Med</strong>
        </div>
        
        <div class="welcome-section">
            <h1>Welcome to <span id="clinic-name-text">&lt;clinic_name&gt;</span></h1>
            <p>Powered By Tap2Med</p>
        </div>
    </header>

    <main id="main-content">
        <p class="instruction-text">Enter your mobile number to get the token number</p>

        <div class="input-container">
            <input 
                type="tel" 
                id="phone-input" 
                placeholder="Enter mobile number" 
                maxlength="10" 
                required
            >
        </div>

        <button id="submit-btn" onclick="goToMemberSelection()">Submit</button>
    </main>

    <footer id="privacy-footer">
        <p>We do not store your phone number or any other personal identifier in our system.</p>
    </footer>

    <script>
        function goToMemberSelection() {
            const phone = document.getElementById('phone-input').value;
            if (phone.length === 10) {
                // BLANK 1: Logic to hide this screen and show the Member List
                console.log("Proceeding to member selection for:", phone);
            } else {
                alert("Please enter a valid 10-digit mobile number.");
            }
        }
    </script>

    
</body>
</html>
