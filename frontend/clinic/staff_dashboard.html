<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reception | Tap2Med</title>
    <link rel="stylesheet" href="/assets/css/variables.css" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/layout.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
    <link rel="stylesheet" href="/assets/css/buttons.css" />
    <link rel="stylesheet" href="/assets/css/pages/staff_dashboard.css" />
  </head>
  <body style="background: #f8fafc">
    <header
      class="top-header"
      style="
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(8px);
        padding: 16px 32px;
        border-bottom: 1px solid var(--border-color);
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: sticky;
        top: 0;
        z-index: 50;
      "
    >
      <div class="brand-header">
        <img
          src="/assets/logo/tap2med_logo.png"
          alt="Tap2Med"
          class="brand-logo"
          onerror="this.style.display = 'none'"
        />
        <span class="brand-text">Tap2Med</span>
        <div class="brand-divider"></div>
        <span class="brand-role">Reception</span>
      </div>
      <div style="display: flex; gap: 12px">
        <a
          href="/staff-directory"
          class="btn btn-secondary btn-sm"
          style="background: white; font-weight: 600; text-decoration: none"
          >Patient Directory</a
        >
        <button
          onclick="showQRCode()"
          class="btn btn-secondary btn-sm"
          style="background: white; font-weight: 600"
        >
          Print Clinic QR
        </button>
        <button
          onclick="logout()"
          class="btn btn-ghost btn-sm"
          style="font-weight: 600"
        >
          Log Out
        </button>
      </div>
    </header>

    <main class="queue-grid">
      <div
        style="
          background: #ffffff;
          border: 1px solid var(--border-color);
          border-radius: 16px;
          padding: 28px;
          margin-bottom: 40px;
          box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        "
      >
        <h3
          style="
            margin-top: 0;
            margin-bottom: 20px;
            color: var(--text-main);
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
          "
        >
          <span style="font-size: 20px">Phone:</span> Manual Walk-in Check-In
        </h3>

        <div
          style="
            display: flex;
            gap: 16px;
            align-items: flex-end;
            flex-wrap: wrap;
          "
        >
          <div style="flex: 1; min-width: 140px">
            <label
              style="
                font-size: 13px;
                font-weight: 600;
                color: var(--text-muted);
                display: block;
                margin-bottom: 8px;
              "
              >Patient Phone</label
            >
            <input
              type="tel"
              id="walkin-phone"
              class="input"
              placeholder="10-digit number (Optional)"
              maxlength="10"
              style="background: #f8fafc; width: 100%"
            />
          </div>
          <div style="flex: 1; min-width: 140px">
            <label
              style="
                font-size: 13px;
                font-weight: 600;
                color: var(--text-muted);
                display: block;
                margin-bottom: 8px;
              "
              >Patient Name</label
            >
            <input
              type="text"
              id="walkin-name"
              class="input"
              placeholder="Full Name"
              style="background: #f8fafc; width: 100%"
              required
            />
          </div>
          <div style="flex: 1; min-width: 140px">
            <label
              style="
                font-size: 13px;
                font-weight: 600;
                color: var(--text-muted);
                display: block;
                margin-bottom: 8px;
              "
              >City (Optional)</label
            >
            <input
              type="text"
              id="walkin-city"
              class="input"
              placeholder="e.g. New Delhi"
              style="background: #f8fafc; width: 100%"
            />
          </div>
          <div style="flex: 1; min-width: 140px">
            <label
              style="
                font-size: 13px;
                font-weight: 600;
                color: var(--text-muted);
                display: block;
                margin-bottom: 8px;
              "
              >Family Member</label
            >
            <select
              id="manual-member-id"
              class="input"
              style="
                width: 100%;
                height: 44px;
                padding: 0 10px;
                border-radius: 8px;
                border: 1px solid #cbd5e1;
                background: white;
              "
            >
              <option value="0">Self</option>
              <option value="1">Spouse</option>
              <option value="2">Father</option>
              <option value="3">Mother</option>
              <option value="4">Eldest Child</option>
              <option value="5">Middle Child</option>
              <option value="6">Youngest Child</option>
              <option value="7">Grandfather</option>
              <option value="8">Grandmother</option>
              <option value="9">Other Relative 1</option>
              <option value="10">Other Relative 2</option>
            </select>
          </div>
          <div style="flex: 1; min-width: 140px">
            <label
              style="
                font-size: 13px;
                font-weight: 600;
                color: var(--text-muted);
                display: block;
                margin-bottom: 8px;
              "
              >Age</label
            >
            <input
              type="number"
              id="walkin-age"
              class="input"
              min="0"
              max="120"
              step="1"
              placeholder="Age"
              style="background: #f8fafc; width: 100%"
            />
          </div>
          <div
            style="
              flex: 0 0 auto;
              display: flex;
              align-items: center;
              height: 44px;
              padding-bottom: 12px;
            "
          >
            <label
              style="
                display: flex;
                align-items: center;
                gap: 8px;
                cursor: pointer;
                margin-bottom: 0;
                font-size: 14px;
                font-weight: 600;
                color: var(--text-main);
                white-space: nowrap;
              "
            >
              <input
                type="checkbox"
                id="walkin-is-appt"
                style="
                  width: 18px;
                  height: 18px;
                  accent-color: var(--primary-color);
                "
              />
              Is Appt?
            </label>
          </div>
          <div style="flex: 0 0 auto">
            <button
              onclick="manualCheckIn()"
              class="btn btn-primary"
              id="btn-manual-checkin"
              style="height: 44px; margin-bottom: 0; white-space: nowrap"
            >
              Generate Token
            </button>
          </div>
        </div>
        <span
          id="manual-status"
          style="
            display: block;
            margin-top: 12px;
            font-size: 14px;
            font-weight: 600;
          "
        ></span>
      </div>

      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 24px;
        "
      >
        <h3
          style="
            margin: 0;
            font-size: 20px;
            color: var(--text-main);
            font-weight: 800;
          "
        >
          Waiting Room
        </h3>
        <span
          class="badge badge-info"
          id="queue-count"
          style="font-size: 14px; padding: 6px 12px"
          >Updating...</span
        >
      </div>
      <div id="staff-queue-list" style="margin-bottom: 48px"></div>

      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 24px;
          padding-top: 32px;
          border-top: 2px dashed #cbd5e1;
        "
      >
        <h3
          style="margin: 0; font-size: 18px; color: #64748b; font-weight: 700"
        >
          Completed Visits
        </h3>
        <span
          class="badge"
          style="
            background: #f1f5f9;
            color: #64748b;
            font-size: 14px;
            padding: 6px 12px;
          "
          id="completed-count"
          >0</span
        >
      </div>
      <div id="staff-completed-list"></div>
    </main>

    <!-- QR Code Standee Modal for Staff -->
    <div id="qrModal" class="backdrop">
      <div
        style="
          background: white;
          padding: 40px;
          border-radius: 16px;
          text-align: center;
          max-width: 380px;
        "
      >
        <h2 style="margin-bottom: 5px; color: var(--primary-color)">
          Clinic Check-In QR
        </h2>
        <p
          style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px"
        >
          Display at reception desk
        </p>
        <div
          id="dashboardQRCode"
          style="display: flex; justify-content: center; margin-bottom: 25px"
        ></div>
        <button
          onclick="printQRCode()"
          class="btn btn-primary btn-block"
          style="background-color: var(--success-color)"
        >
          Print Check-In Poster
        </button>
        <button
          onclick="document.getElementById('qrModal').style.display = 'none'"
          class="btn btn-ghost btn-block"
          style="margin-top: 10px"
        >
          Close
        </button>
      </div>
    </div>

    <!-- PRINT LAYOUT 3: Printable QR Code Standee Layout -->
    <div id="print-qr-layout" class="print-only">
      <div
        style="
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 10px;
          margin-bottom: 12px;
        "
      >
        <img
          src="/assets/logo/tap2med_logo.png"
          style="width: 50px; height: 40px; object-fit: contain"
          onerror="this.style.display = 'none'"
        />
        <span
          style="
            font-size: 32px;
            font-weight: 800;
            color: #0284c7;
            font-family: &quot;Inter&quot;, sans-serif;
          "
          >Tap2Med</span
        >
      </div>
      <p
        style="
          font-size: 18px;
          color: #64748b;
          margin-top: 0;
          margin-bottom: 20px;
          font-weight: 600;
        "
      >
        Clinic Check-In
      </p>
      <h1
        style="
          font-size: 34px;
          font-weight: 800;
          color: #0f172a;
          margin-bottom: 30px;
        "
      >
        Scan to Check-In
      </h1>
      <div
        id="print-qr-target"
        style="display: flex; justify-content: center; margin-bottom: 30px"
      ></div>
      <h2
        id="print-qr-clinic-name"
        style="
          font-size: 28px;
          font-weight: 800;
          color: #0284c7;
          margin-bottom: 8px;
        "
      >
        Clinic Name
      </h2>
      <p style="font-size: 15px; color: #64748b; font-weight: 500">
        Powered by Tap2Med
      </p>
    </div>

    <!-- Scripts -->
    <script src="/assets/js/print_engine.js?v=20260914_3"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="/assets/js/labs.js?v=20260914_3"></script>
    <script src="/assets/js/pages/staff_dashboard.js?v=20260914_3"></script>
    <script src="/assets/js/load_layouts.js?v=20260914_3"></script>
  </body>
</html>
