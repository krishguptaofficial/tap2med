<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Consultation | Tap2Med</title>
    <link rel="stylesheet" href="/static/dashboard.css" />
  </head>
  <body>
    <div class="app-layout">
      <div id="sidebar-backdrop" class="backdrop"></div>

      <aside id="app-sidebar" class="sidebar">
        <div class="sidebar-box">
          <div class="queue-text">
            <ul>
              <li>
                Today's queue number:
                <strong id="current-token" style="color: #007bff">#--</strong>
              </li>
            </ul>
          </div>
        </div>

        <div class="sidebar-box" style="flex-grow: 1; overflow-y: auto">
          <div class="history-title">Visit History:</div>
          <div
            id="history-content"
            style="
              padding: 15px;
              background: #f8f9fa;
              border-radius: 5px;
              border: 1px solid #eee;
              min-height: 200px;
            "
          >
            Date wise history...
          </div>
        </div>

        <div class="sidebar-footer">
          <ul>
            <li id="doc-name">Loading...</li>
            <li id="clinic-name">Loading...</li>
          </ul>
        </div>
      </aside>

      <main class="main-wrapper">
        <div class="mobile-header">
          <button class="icon-btn" id="mobile-menu-btn">☰</button>
          <h3 style="margin: 0">Tap2Med OPD</h3>
        </div>

        <div class="action-bar">
          <button class="btn-light">Copy Last Prescription</button>
          <button class="btn-light" id="print-btn">Print/share</button>
        </div>

        <div class="prescription-area">
          <div class="rx-title">Draft Prescription</div>

          <div id="rx-container">
            <div class="rx-row">
              <input
                type="text"
                class="rx-med"
                value=""
                placeholder="Medicine & Dose"
              />
              <input
                type="text"
                class="rx-freq"
                value=""
                placeholder="Frequency & Instructions"
              />
            </div>
            <div class="rx-row">
              <input
                type="text"
                class="rx-med"
                value=""
                placeholder="Medicine & Dose"
              />
              <input
                type="text"
                class="rx-freq"
                value=""
                placeholder="Frequency & Instructions"
              />
            </div>
            <div class="rx-row">
              <input
                type="text"
                class="rx-med"
                value=""
                placeholder="Medicine & Dose"
              />
              <input
                type="text"
                class="rx-freq"
                value=""
                placeholder="Frequency & Instructions"
              />
            </div>
            <div class="rx-row">
              <input
                type="text"
                class="rx-med"
                value=""
                placeholder="Medicine & Dose"
              />
              <input
                type="text"
                class="rx-freq"
                value=""
                placeholder="Frequency & Instructions"
              />
            </div>
          </div>

          <button class="btn-add-row" id="add-row-btn">+ Add Medicine</button>
        </div>
      </main>
    </div>
    <script>
      let currentLocalToken = null;

      const clinicId = new URLSearchParams(window.location.search).get(
        "clinic",
      );

      // FIX 3: Unified the variable name to currentTokenElement
      const currentTokenElement = document.getElementById("current-token");
      const historyContentElement = document.getElementById("history-content");
      const rxContainer = document.getElementById("rx-container");

      function toggleSidebar() {
        document.getElementById("app-sidebar").classList.toggle("open");
        document.getElementById("sidebar-backdrop").classList.toggle("open");
      }

      document
        .getElementById("add-row-btn")
        .addEventListener("click", function () {
          const row = document.createElement("div");
          row.className = "rx-row";
          row.innerHTML = `
              <input type="text" class="rx-med" placeholder="Medicine & Dose">
              <input type="text" class="rx-freq" placeholder="Frequency & Instructions">
          `;
          rxContainer.appendChild(row);
        });

      async function loadNextPatient() {
        if (!clinicId) {
          currentTokenElement.innerText = "Error: No Clinic ID";
          return;
        }

        try {
          let response = await fetch(`/api/clinics/queue/${clinicId}`);
          let data = await response.json();

          document.getElementById("doc-name").innerText = data.doctor_name;
          document.getElementById("clinic-name").innerText = data.clinic_name;

          if (data.queue && data.queue.length > 0) {
            let currentPatient = data.queue[0];

            if (currentLocalToken !== currentPatient.local_token) {
              currentLocalToken = currentPatient.local_token;
              currentTokenElement.innerText = `#${currentPatient.token_number}`;
              loadHistory(currentLocalToken);
            }
          } else {
            currentTokenElement.innerText = `Empty`;
            historyContentElement.innerHTML = `<p style="color: #666;">No patients waiting.</p>`;
            currentLocalToken = null;
          }
        } catch (e) {
          console.error("Network poll failed, retrying silently in 5s...");
        }
      }

      async function loadHistory(localToken) {
        const mockPastVisits = [];
        let historyHtml = `<p>ID: ${localToken}</p>`;

        mockPastVisits.forEach((visit) => {
          let medList = visit.medicines
            .map(
              (med) =>
                `<li><strong>${med.name}</strong><br><span>${med.instructions}</span></li>`,
            )
            .join("");

          historyHtml += `
            <details>
                <summary>📅 ${visit.date}</summary>
                <div><ul>${medList}</ul></div>
            </details>
        `;
        });
        historyContentElement.innerHTML = historyHtml;
      }

      
       document
        .getElementById("print-btn")
        .addEventListener("click", async function () {
          if (!currentLocalToken) return;

          // 1. Scrape the DOM (The Screen) for the ink
          const medicinesPayload = [];
          document.querySelectorAll(".rx-row").forEach(row => {
            const medName = row.querySelector(".rx-med").value;
            const medFreq = row.querySelector(".rx-freq").value;

            // Only grab rows where the doctor actually typed something
            if (medName.trim() !== "") {
              medicinesPayload.push({ name: medName, instructions: medFreq });
            }
          });

          // BLANK 1: Should we block the doctor from completing the visit if they haven't typed ANY medicines, or do we allow "empty" prescriptions (e.g., the doctor just gave verbal advice)?
          if (medicinesPayload.length === 0 && !confirm("No medicines entered. Mark visit as complete anyway?")) {
              alert("Please enter at least one medicine or note.");
              return;
          }


          window.print();

          try {
            await fetch("/api/events/complete", {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                local_token: currentLocalToken,
                medicines: medicinesPayload
              }),
            });
            
            rxContainer.innerHTML = "";
            document.getElementById("add-row-btn").click();

            currentLocalToken = null;
            loadNextPatient(); 
            
          } catch (e) {
            console.error("Failed to save prescription:", e);
            alert("Network Error: The paper printed, but the history did not save. Please check your Wi-Fi and click Print again.");
          }
        });

      loadNextPatient();
      setInterval(loadNextPatient, 5000);
    </script>
  </body>
</html>
