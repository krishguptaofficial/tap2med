<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doctor Dashboard | Tap2Med</title>
    <link rel="stylesheet" href="/assets/css/variables.css" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/layout.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
    <link rel="stylesheet" href="/assets/css/buttons.css" />
    <style>
      .dashboard-grid { max-width: 1200px; margin: 40px auto; padding: 0 20px; display: grid; grid-template-columns: 1fr 350px; gap: 32px; align-items: start; }
      @media (max-width: 900px) { .dashboard-grid { grid-template-columns: 1fr; } }
      
      .panel { background: #ffffff; border: 1px solid var(--border-color); border-radius: 16px; padding: 28px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); }
      
      .token-badge { font-size: 32px; font-weight: 800; color: var(--primary-color); background: #e0f2fe; padding: 12px 24px; border-radius: 12px; letter-spacing: -0.02em; display: inline-block; margin-bottom: 16px; }
      
      .vitals-bar { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; margin-bottom: 24px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
      .vital-pill { background: white; border: 1px solid #cbd5e1; padding: 6px 12px; border-radius: 8px; font-size: 14px; font-weight: 600; color: #334155; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
      
      .med-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px; margin-bottom: 12px; align-items: center; background: #f8fafc; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0; }
      .advice-row { background: #f0fdf4; border: 1px solid #bbf7d0; }
      
      .queue-item { display: flex; justify-content: space-between; padding: 16px; border-bottom: 1px solid #f1f5f9; align-items: center; }
      .queue-item:last-child { border-bottom: none; }
      
      .brand-header { display: flex; align-items: center; gap: 12px; }
      .brand-logo { width: 38px; height: 32px; object-fit: contain; }
      .brand-text { font-size: 22px; font-weight: 800; color: var(--primary-color); letter-spacing: -0.02em; }
    </style>
  </head>
  <body style="background: #f8fafc;">
    
    <header class="top-header" style="background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(8px); padding: 16px 32px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50;">
      <div class="brand-header">
        <img src="/assets/logo/tap2med_logo.png" alt="Tap2Med" class="brand-logo" onerror="this.style.display='none'" />
        <span class="brand-text">Tap2Med</span>
        <div style="width: 2px; height: 24px; background: #e2e8f0; margin: 0 8px;"></div>
        <span style="font-size: 15px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;" id="header-doctor-name">Doctor</span>
      </div>
      <button onclick="logout()" class="btn btn-secondary btn-sm" style="font-weight: 600;">Log Out</button>
    </header>

    <main class="dashboard-grid">
      
      <!-- Left Column: Active Consultation -->
      <div class="panel" id="active-consultation-panel">
          <div id="no-patient-state" style="text-align: center; padding: 60px 20px; display: none;">
              <div style="font-size: 48px; margin-bottom: 16px;">☕</div>
              <h2 style="margin: 0 0 8px 0; color: var(--text-main);">Queue is Empty</h2>
              <p style="color: var(--text-muted); margin: 0;">Waiting for the receptionist to add the next patient.</p>
          </div>

          <div id="active-patient-state">
              <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                  <div class="token-badge" id="current-token">#--</div>
                  <span style="background: #dcfce7; color: #166534; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 700;">In Session</span>
              </div>
              
              <!-- Vitals Display with Doctor's Update Button -->
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                  <h4 style="margin: 0; font-size: 14px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;">Patient Vitals</h4>
                  <button onclick="openVitalsModal()" class="btn btn-ghost" style="padding: 4px 8px; font-size: 12px; color: var(--primary-color);">✏️ Update Vitals</button>
              </div>
              
              <div class="vitals-bar" id="current-vitals">
                  <!-- Vitals will be injected here as pills -->
                  <span style="color: #94a3b8; font-size: 14px; font-style: italic;">No vitals recorded.</span>
              </div>

              <!-- Prescription Pad -->
              <h4 style="margin: 24px 0 16px 0; font-size: 16px; color: var(--text-main); border-bottom: 2px solid #f1f5f9; padding-bottom: 8px;">Prescription Pad</h4>
              
              <div id="medicine-list"></div>

              <!-- Medicine Input Row -->
              <div style="display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 12px; margin-top: 16px; align-items: end;">
                  <div>
                      <label style="font-size: 12px; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 4px;">Medicine Name</label>
                      <input type="text" id="med-name" placeholder="e.g. Paracetamol 500mg" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px;">
                  </div>
                  <div>
                      <label style="font-size: 12px; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 4px;">Dosage</label>
                      <input type="text" id="med-dosage" placeholder="e.g. 1-0-1" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px;">
                  </div>
                  <div>
                      <label style="font-size: 12px; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 4px;">Days</label>
                      <input type="text" id="med-days" placeholder="e.g. 5 days" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px;">
                  </div>
                  <button onclick="addMedicine()" class="btn btn-secondary" style="padding: 10px 20px;">+ Add</button>
              </div>

              <!-- Lifestyle Changes Section -->
              <div style="margin-top: 20px;">
                  <button onclick="toggleLifestyle()" id="btn-toggle-lifestyle" class="btn btn-ghost" style="color: #059669; padding: 0; font-size: 14px; font-weight: 600;">+ Add Lifestyle / Advice</button>
              </div>
              
              <div id="lifestyle-section" style="display: none; grid-template-columns: 2fr 1fr auto; gap: 12px; margin-top: 12px; align-items: end; background: #f0fdf4; padding: 16px; border-radius: 8px; border: 1px dashed #bbf7d0;">
                   <div>
                      <label style="font-size: 12px; font-weight: 600; color: #166534; display: block; margin-bottom: 4px;">Advice / Lifestyle Change</label>
                      <input type="text" id="life-advice" placeholder="e.g. Drink warm water, avoid cold items" style="width: 100%; padding: 10px; border: 1px solid #bbf7d0; border-radius: 8px; font-size: 14px; background: white;">
                  </div>
                  <div>
                      <label style="font-size: 12px; font-weight: 600; color: #166534; display: block; margin-bottom: 4px;">Duration</label>
                      <input type="text" id="life-duration" placeholder="e.g. 1 month" style="width: 100%; padding: 10px; border: 1px solid #bbf7d0; border-radius: 8px; font-size: 14px; background: white;">
                  </div>
                  <button onclick="addLifestyle()" class="btn btn-secondary" style="padding: 10px 20px; background: white; border-color: #bbf7d0; color: #166534; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">+ Add Advice</button>
              </div>

              <div style="margin-top: 40px; border-top: 1px solid #e2e8f0; padding-top: 24px; display: flex; justify-content: flex-end;">
                  <button onclick="completeVisit()" class="btn btn-primary" id="btn-complete" style="font-size: 16px; padding: 14px 32px; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);">
                      Save & Call Next Patient
                  </button>
              </div>
          </div>
      </div>

      <!-- Right Column: Up Next Queue -->
      <div class="panel" style="padding: 0; overflow: hidden; background: #f8fafc;">
          <div style="background: white; padding: 20px 24px; border-bottom: 1px solid #e2e8f0;">
              <h3 style="margin: 0; font-size: 18px; color: var(--text-main); font-weight: 700;">Up Next</h3>
          </div>
          <div id="doctor-queue-list" style="max-height: 600px; overflow-y: auto;">
              <!-- Queue items injected here -->
          </div>
      </div>

    </main>

    <!-- Complete Vitals Modal (Doctor View) -->
    <div id="vitals-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(4px); z-index: 100; align-items: center; justify-content: center;">
      <div style="background: white; padding: 32px; border-radius: 16px; width: 100%; max-width: 550px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);">
        <h3 style="margin-top: 0; color: var(--text-main); margin-bottom: 24px; font-size: 20px; font-weight: 700;">Update Vitals</h3>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px;">
            <div>
                <label style="font-size: 12px; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 4px;">BP (mmHg)</label>
                <div style="display: flex; align-items: center; gap: 4px;">
                    <input type="number" id="vital-bp-sys" placeholder="Sys" style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px;">
                    <span style="color: #94a3b8; font-weight: bold;">/</span>
                    <input type="number" id="vital-bp-dia" placeholder="Dia" style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px;">
                </div>
            </div>
            <div>
                <label style="font-size: 12px; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 4px;">Pulse (bpm)</label>
                <input type="number" id="vital-pr" placeholder="e.g. 80" style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px;">
            </div>
            <div>
                <label style="font-size: 12px; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 4px;">Weight (kg)</label>
                <input type="number" id="vital-wt" placeholder="e.g. 70" style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px;">
            </div>
            <div>
                <label style="font-size: 12px; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 4px;">Height (cm)</label>
                <input type="number" id="vital-ht" placeholder="e.g. 170" style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px;">
            </div>
            <div>
                <label style="font-size: 12px; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 4px;">Temperature (F)</label>
                <input type="number" id="vital-temp" placeholder="e.g. 98.6" style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px;">
            </div>
            <div>
                <label style="font-size: 12px; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 4px;">SpO2 (%)</label>
                <input type="number" id="vital-spo2" placeholder="e.g. 99" style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px;">
            </div>
            <div>
                <label style="font-size: 12px; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 4px;">Waist (cm)</label>
                <input type="number" id="vital-waist" placeholder="e.g. 85" style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px;">
            </div>
            <div>
                <label style="font-size: 12px; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 4px;">Hip (cm)</label>
                <input type="number" id="vital-hip" placeholder="e.g. 95" style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px;">
            </div>
        </div>

        <div style="display: flex; gap: 12px; justify-content: flex-end; padding-top: 16px; border-top: 1px solid #e2e8f0;">
            <button onclick="closeVitalsModal()" class="btn btn-ghost" style="color: var(--text-muted);">Cancel</button>
            <button onclick="submitVitals()" class="btn btn-primary" style="padding-left: 24px; padding-right: 24px;">Save Vitals</button>
        </div>
      </div>
    </div>

    <script>
      const clinicId = localStorage.getItem("tap2med_clinic_id");
      if (!clinicId) window.location.href = "/doctor-login";

      let currentPatientToken = null;
      let medicines = [];

      function logout() {
          localStorage.removeItem("tap2med_clinic_id");
          localStorage.removeItem("tap2med_doctor_role");
          window.location.href = "/doctor-login";
      }

      function getShortCode(tokenNumber) {
          const letters = "ABCDEFGHJKLMNPQRSTUVWXYZ"; 
          const letter = letters[(tokenNumber - 1) % 24]; 
          return `${letter}-${tokenNumber}`; 
      }

      /* --- Vitals Logic for Doctor --- */
      function openVitalsModal() {
          if (!currentPatientToken) return;
          document.getElementById('vitals-modal').style.display = 'flex';
          
          ['bp-sys', 'bp-dia', 'pr', 'wt', 'ht', 'temp', 'spo2', 'waist', 'hip'].forEach(id => {
              document.getElementById(`vital-${id}`).value = '';
          });
      }

      function closeVitalsModal() {
          document.getElementById('vitals-modal').style.display = 'none';
      }

      async function submitVitals() {
          if (!currentPatientToken) return;
          
          const sys = document.getElementById('vital-bp-sys').value.trim();
          const dia = document.getElementById('vital-bp-dia').value.trim();
          const pr = document.getElementById('vital-pr').value.trim();
          const wt = document.getElementById('vital-wt').value.trim();
          const ht = document.getElementById('vital-ht').value.trim();
          const temp = document.getElementById('vital-temp').value.trim();
          const spo2 = document.getElementById('vital-spo2').value.trim();
          const waist = document.getElementById('vital-waist').value.trim();
          const hip = document.getElementById('vital-hip').value.trim();

          let compiledVitals = [];
          if (sys && dia) compiledVitals.push(`BP:${sys}/${dia}`);
          if (pr) compiledVitals.push(`PR:${pr}`);
          if (wt) compiledVitals.push(`Wt:${wt}kg`);
          if (ht) compiledVitals.push(`Ht:${ht}cm`);
          if (temp) compiledVitals.push(`T:${temp}F`);
          if (spo2) compiledVitals.push(`SpO2:${spo2}%`);
          if (waist) compiledVitals.push(`Waist:${waist}cm`);
          if (hip) compiledVitals.push(`Hip:${hip}cm`);

          const finalString = compiledVitals.join(' | ');
          
          if (!finalString) {
              closeVitalsModal();
              return; 
          }

          try {
              // Send directly to the backend
              await fetch("/api/events/weight", {
                  method: "PUT",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ local_token: currentPatientToken, weight: finalString })
              });
              
              closeVitalsModal();
              renderVitals(finalString); // Update the doctor UI instantly
          } catch (e) {
              alert("Failed to save vitals.");
          }
      }

      function renderVitals(vitalsString) {
          const vitalsContainer = document.getElementById("current-vitals");
          if (!vitalsString || vitalsString.trim() === "") {
              vitalsContainer.innerHTML = '<span style="color: #94a3b8; font-size: 14px; font-style: italic;">No vitals recorded.</span>';
              return;
          }

          const parts = vitalsString.split('|').map(p => p.trim()).filter(p => p);
          
          vitalsContainer.innerHTML = "";
          parts.forEach(part => {
              const pill = document.createElement("div");
              pill.className = "vital-pill";
              
              let icon = "📋";
              if (part.includes("BP")) icon = "❤️";
              if (part.includes("PR") || part.includes("Pulse")) icon = "💓";
              if (part.includes("Wt") || part.includes("Weight")) icon = "⚖️";
              if (part.includes("T:") || part.includes("Temp")) icon = "🌡️";
              if (part.includes("SpO2")) icon = "🫁";
              
              pill.innerHTML = `${icon} ${part}`;
              vitalsContainer.appendChild(pill);
          });
      }

      /* --- Prescription Pad Logic --- */
      function renderMedicines() {
          const list = document.getElementById("medicine-list");
          list.innerHTML = "";
          
          if (medicines.length === 0) {
              list.innerHTML = '<div style="text-align: center; padding: 20px; border: 1px dashed #cbd5e1; border-radius: 8px; color: #94a3b8; font-size: 14px;">No medicines or advice added yet.</div>';
              return;
          }

          medicines.forEach((med, index) => {
              const row = document.createElement("div");
              const isAdvice = med.name.startsWith("Advice:");
              
              row.className = `med-row ${isAdvice ? 'advice-row' : ''}`;
              
              // Remove the "Advice: " prefix for cleaner display if it's a lifestyle entry
              const displayName = isAdvice ? med.name.replace("Advice: ", "🌿 ") : med.name;

              row.innerHTML = `
                  <div style="font-weight: 600; color: ${isAdvice ? '#166534' : '#0f172a'}; font-size: 15px;">${displayName}</div>
                  <div style="color: ${isAdvice ? '#059669' : '#475569'}; font-size: 14px; font-style: italic;">${med.instructions}</div>
                  <button onclick="removeMedicine(${index})" class="btn btn-ghost" style="color: var(--error-color); padding: 6px 12px; font-size: 13px;">✕ Remove</button>
              `;
              list.appendChild(row);
          });
      }

      function addMedicine() {
          const nameInput = document.getElementById("med-name");
          const dosageInput = document.getElementById("med-dosage");
          const daysInput = document.getElementById("med-days");
          
          const name = nameInput.value.trim();
          const dosage = dosageInput.value.trim();
          const days = daysInput.value.trim();
          
          if (!name) {
              alert("Please enter a medicine name.");
              return;
          }
          
          // Glue dosage and days together for the backend
          let inst = dosage;
          if (days) inst += (inst ? ' for ' : '') + days;
          
          medicines.push({ name: name, instructions: inst });
          
          nameInput.value = "";
          dosageInput.value = "";
          daysInput.value = "";
          nameInput.focus();
          
          renderMedicines();
      }

      function toggleLifestyle() {
          const sec = document.getElementById("lifestyle-section");
          sec.style.display = sec.style.display === "none" ? "grid" : "none";
      }

      function addLifestyle() {
          const advInput = document.getElementById("life-advice");
          const durInput = document.getElementById("life-duration");
          
          const adv = advInput.value.trim();
          const dur = durInput.value.trim();
          
          if (!adv) {
              alert("Please enter the lifestyle advice.");
              return;
          }
          
          let inst = dur ? `Duration: ${dur}` : "";
          
          // Prepend "Advice:" so the system can style it beautifully, but to the backend it's just another string.
          medicines.push({ name: `Advice: ${adv}`, instructions: inst });
          
          advInput.value = "";
          durInput.value = "";
          advInput.focus();
          
          renderMedicines();
      }

      function removeMedicine(index) {
          medicines.splice(index, 1);
          renderMedicines();
      }

      async function completeVisit() {
          if (!currentPatientToken) return;
          
          const btn = document.getElementById("btn-complete");
          btn.disabled = true;
          btn.textContent = "Saving...";

          try {
              const response = await fetch("/api/events/complete", {
                  method: "PUT",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ 
                      local_token: currentPatientToken, 
                      medicines: medicines 
                  })
              });

              if (!response.ok) throw new Error("Failed to complete visit");
              
              medicines = [];
              renderMedicines();
              await loadQueue();
              
          } catch (error) {
              alert("Error saving prescription. Please try again.");
          } finally {
              btn.disabled = false;
              btn.textContent = "Save & Call Next Patient";
          }
      }

      async function loadQueue() {
          try {
              const response = await fetch(`/api/clinics/queue/${encodeURIComponent(clinicId)}`);
              if (!response.ok) return;
              
              const data = await response.json();
              document.getElementById("header-doctor-name").textContent = data.doctor_name;
              
              const waiting = data.queue.filter(p => p.status === 'waiting');
              const queueList = document.getElementById("doctor-queue-list");
              
              const noPatientState = document.getElementById("no-patient-state");
              const activePatientState = document.getElementById("active-patient-state");

              if (waiting.length === 0) {
                  noPatientState.style.display = "block";
                  activePatientState.style.display = "none";
                  queueList.innerHTML = '<div style="padding: 32px 20px; text-align: center; color: #94a3b8; font-size: 14px;">No patients waiting.</div>';
                  currentPatientToken = null;
                  return;
              }

              noPatientState.style.display = "none";
              activePatientState.style.display = "block";
              
              const activePatient = waiting[0];
              
              if (currentPatientToken !== activePatient.local_token) {
                  currentPatientToken = activePatient.local_token;
                  document.getElementById("current-token").textContent = `#${getShortCode(activePatient.daily_token_number)}`;
                  renderVitals(activePatient.weight); 
                  medicines = [];
                  renderMedicines();
              }

              queueList.innerHTML = "";
              if (waiting.length === 1) {
                  queueList.innerHTML = '<div style="padding: 24px 20px; text-align: center; color: #94a3b8; font-size: 14px;">You are seeing the last patient.</div>';
              } else {
                  for (let i = 1; i < waiting.length; i++) {
                      const p = waiting[i];
                      const item = document.createElement("div");
                      item.className = "queue-item";
                      item.innerHTML = `
                          <div style="font-size: 18px; font-weight: 700; color: var(--text-main);">#${getShortCode(p.daily_token_number)}</div>
                          <div style="font-size: 12px; color: #64748b; background: #f1f5f9; padding: 4px 8px; border-radius: 6px;">Pos: ${i + 1}</div>
                      `;
                      queueList.appendChild(item);
                  }
              }

          } catch (error) {
              console.error("Queue error:", error);
          }
      }

      // Smooth keyboard navigation for the split medicine fields
      document.getElementById("med-name").addEventListener("keypress", function(event) {
          if (event.key === "Enter") { event.preventDefault(); document.getElementById("med-dosage").focus(); }
      });
      document.getElementById("med-dosage").addEventListener("keypress", function(event) {
          if (event.key === "Enter") { event.preventDefault(); document.getElementById("med-days").focus(); }
      });
      document.getElementById("med-days").addEventListener("keypress", function(event) {
          if (event.key === "Enter") { event.preventDefault(); addMedicine(); }
      });

      // Smooth keyboard navigation for lifestyle fields
      document.getElementById("life-advice").addEventListener("keypress", function(event) {
          if (event.key === "Enter") { event.preventDefault(); document.getElementById("life-duration").focus(); }
      });
      document.getElementById("life-duration").addEventListener("keypress", function(event) {
          if (event.key === "Enter") { event.preventDefault(); addLifestyle(); }
      });

      loadQueue();
      setInterval(loadQueue, 5000);
    </script>
  </body>
</html>
