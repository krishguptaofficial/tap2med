<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tap2Med — Clinic Login</title>
    <link rel="stylesheet" href="/assets/css/pages/login.css" />
  </head>
  <body>
    <main class="login-container">
      <h1>Clinic Login</h1>

      <section id="password-login">
        <label>Email</label>
        <input id="email" type="email" autocomplete="email" />
        <label>Password</label>
        <input id="password" type="password" autocomplete="current-password" />
        <button id="btn-password-login">Sign in</button>
        <p><a href="#" id="forgot-link">Forgot password?</a></p>
        <hr />
        <button id="btn-send-login-otp">Send login OTP</button>
      </section>

      <section id="otp-section" style="display: none">
        <label>Enter OTP</label>
        <input id="otp" type="text" maxlength="6" />
        <button id="btn-verify-otp">Verify OTP</button>
      </section>

      <section id="forgot-section" style="display: none">
        <label>Email</label>
        <input id="forgot-email" type="email" />
        <button id="btn-forgot-send">Send reset OTP</button>
      </section>

      <section id="reset-section" style="display: none">
        <label>OTP</label>
        <input id="reset-otp" type="text" maxlength="6" />
        <label>New Password</label>
        <input id="reset-password" type="password" />
        <button id="btn-reset-submit">Reset Password</button>
      </section>

      <div id="message" role="status"></div>
    </main>

    <script src="/assets/js/pages/login.js"></script>
  </body>
</html>
