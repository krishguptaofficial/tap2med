<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Tap2Med — Patient Journey</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #05080e;
        --surface: #0b1120;
        --card: #0f1929;
        --border: rgba(255, 255, 255, 0.06);
        --text: #e2e8f0;
        --muted: #475569;
        --panel-w: 400px;
        --blue: #3b82f6;
        --indigo: #6366f1;
        --amber: #f59e0b;
        --red: #ef4444;
        --purple: #8b5cf6;
        --green: #10b981;
        --cyan: #06b6d4;
        --font: "Inter", system-ui, sans-serif;
        --mono: "JetBrains Mono", monospace;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        font-family: var(--font);
        color: var(--text);
      }

      #root {
        display: flex;
        width: 100vw;
        height: 100vh;
      }

      /* ══════════════════════════════════
   LEFT PANEL
══════════════════════════════════ */
      #panel {
        width: var(--panel-w);
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        background: var(--surface);
        border-right: 1px solid var(--border);
        position: relative;
        z-index: 10;
      }

      #panel-header {
        padding: 22px 28px 18px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .panel-logo {
        font-size: 0.88rem;
        font-weight: 800;
        letter-spacing: -0.3px;
        color: var(--text);
      }
      .panel-logo span {
        color: var(--muted);
        font-weight: 500;
      }
      .panel-badge {
        font-size: 0.62rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        color: var(--blue);
        background: rgba(59, 130, 246, 0.1);
        border: 1px solid rgba(59, 130, 246, 0.2);
        padding: 3px 9px;
        border-radius: 4px;
      }

      /* step dots */
      #step-dots {
        display: flex;
        gap: 4px;
        padding: 16px 28px 0;
        flex-shrink: 0;
        flex-wrap: wrap;
      }
      .dot {
        height: 3px;
        border-radius: 2px;
        background: #1e293b;
        transition:
          background 0.3s,
          width 0.25s;
        cursor: pointer;
        flex: 1;
        min-width: 8px;
        max-width: 20px;
      }
      .dot.done {
        background: #1e3a5f;
      }
      .dot.active {
        background: var(--blue);
        box-shadow: 0 0 6px rgba(59, 130, 246, 0.6);
      }

      /* story */
      #story {
        flex: 1;
        overflow-y: auto;
        padding: 20px 28px 16px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      #story::-webkit-scrollbar {
        width: 3px;
      }
      #story::-webkit-scrollbar-track {
        background: transparent;
      }
      #story::-webkit-scrollbar-thumb {
        background: #1e293b;
        border-radius: 2px;
      }

      .step-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .step-counter {
        font-size: 0.65rem;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--muted);
      }
      .step-index {
        font-size: 2.8rem;
        font-weight: 800;
        color: rgba(59, 130, 246, 0.15);
        line-height: 1;
        letter-spacing: -2px;
        font-variant-numeric: tabular-nums;
      }

      #step-title {
        font-size: 1.2rem;
        font-weight: 700;
        line-height: 1.3;
        letter-spacing: -0.3px;
        color: var(--text);
      }

      /* patient action card */
      #patient-action {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 13px 14px;
      }
      .pa-avatar {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        background: linear-gradient(
          135deg,
          rgba(59, 130, 246, 0.2),
          rgba(99, 102, 241, 0.2)
        );
        border: 1px solid rgba(59, 130, 246, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .pa-avatar svg {
        width: 16px;
        height: 16px;
        fill: var(--blue);
      }
      .pa-meta {
        flex: 1;
        min-width: 0;
      }
      .pa-name {
        font-size: 0.68rem;
        font-weight: 700;
        color: var(--blue);
        letter-spacing: 0.3px;
        margin-bottom: 4px;
        text-transform: uppercase;
      }
      .pa-text {
        font-size: 0.82rem;
        color: #94a3b8;
        line-height: 1.55;
      }

      /* tech detail */
      #tech-detail {
        font-size: 0.78rem;
        color: var(--muted);
        line-height: 1.75;
        padding-left: 12px;
        border-left: 2px solid #1e293b;
      }

      /* code block */
      #code-wrap {
        display: flex;
        flex-direction: column;
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.06);
      }
      #code-wrap.hidden {
        display: none;
      }
      #code-header {
        background: #080d16;
        padding: 8px 14px;
        display: flex;
        align-items: center;
        gap: 8px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      }
      .code-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
      #code-lang {
        font-size: 0.62rem;
        font-weight: 600;
        color: #334155;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-left: 4px;
      }
      #code-block {
        background: #080d16;
        padding: 14px 16px;
        font-family: var(--mono);
        font-size: 0.72rem;
        line-height: 1.85;
        overflow-x: auto;
      }
      .c-comment {
        color: #2d4a6a;
      }
      .c-key {
        color: #f97583;
      }
      .c-fn {
        color: #b392f0;
      }
      .c-str {
        color: #79b8ff;
      }
      .c-val {
        color: #ffab70;
      }
      .c-result {
        color: #85e89d;
        font-weight: 600;
      }
      .c-del {
        color: #ef4444;
        text-decoration: line-through;
        opacity: 0.7;
      }

      /* highlight box */
      #highlight-box {
        border-radius: 8px;
        padding: 11px 14px;
        font-size: 0.78rem;
        line-height: 1.55;
        font-weight: 500;
        border: 1px solid transparent;
      }
      #highlight-box.hidden {
        display: none;
      }

      /* progress */
      #prog-wrap {
        padding: 0 28px 10px;
        flex-shrink: 0;
      }
      #prog-bar-bg {
        height: 2px;
        background: #0f172a;
        border-radius: 1px;
        overflow: hidden;
      }
      #prog-bar-fill {
        height: 100%;
        border-radius: 1px;
        width: 0%;
        background: linear-gradient(90deg, var(--blue), var(--indigo));
        transition: width 0.08s linear;
      }

      /* nav */
      #nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 28px 20px;
        flex-shrink: 0;
        border-top: 1px solid var(--border);
        gap: 10px;
      }
      .btn-nav {
        background: transparent;
        border: 1px solid #1e293b;
        color: var(--muted);
        padding: 8px 16px;
        border-radius: 7px;
        font-size: 0.78rem;
        font-weight: 600;
        cursor: pointer;
        font-family: var(--font);
        transition:
          border-color 0.15s,
          color 0.15s,
          background 0.15s;
      }
      .btn-nav:hover:not(:disabled) {
        border-color: #2d3f5a;
        color: var(--text);
        background: rgba(255, 255, 255, 0.03);
      }
      .btn-nav:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }
      .btn-auto {
        flex: 1;
        background: var(--blue);
        border: none;
        color: #fff;
        padding: 8px 16px;
        border-radius: 7px;
        font-size: 0.78rem;
        font-weight: 700;
        cursor: pointer;
        font-family: var(--font);
        transition:
          opacity 0.15s,
          transform 0.1s;
        letter-spacing: 0.2px;
      }
      .btn-auto:hover {
        opacity: 0.88;
        transform: translateY(-1px);
      }
      .btn-auto:active {
        transform: translateY(0);
      }

      /* ══════════════════════════════════
   DIAGRAM
══════════════════════════════════ */
      #diagram {
        flex: 1;
        position: relative;
        overflow: hidden;
        background: var(--bg);
      }

      /* dot grid */
      #diagram::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: radial-gradient(
          circle,
          rgba(59, 130, 246, 0.08) 1px,
          transparent 1px
        );
        background-size: 32px 32px;
        pointer-events: none;
      }

      /* subtle vignette */
      #diagram::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse at 50% 50%,
          transparent 40%,
          rgba(5, 8, 14, 0.7) 100%
        );
        pointer-events: none;
      }

      #svg-edges {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        pointer-events: none;
        z-index: 1;
      }

      /* ══════════════════════════════════
   NODES
══════════════════════════════════ */
      .node {
        position: absolute;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 2;
        transition: transform 0.3s cubic-bezier(0.34, 1.4, 0.64, 1);
      }
      .node-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 11px;
        width: 118px;
        overflow: hidden;
        box-shadow: 0 2px 16px rgba(0, 0, 0, 0.4);
        transition:
          border-color 0.35s,
          box-shadow 0.35s;
        position: relative;
      }
      .node-top-bar {
        height: 2px;
        width: 100%;
        background: var(--node-color, #3b82f6);
        opacity: 0.4;
        transition: opacity 0.35s;
      }
      .node-body {
        padding: 11px 12px 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        text-align: center;
      }
      .node-icon-wrap {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.05);
        flex-shrink: 0;
      }
      .node-icon-wrap svg {
        width: 16px;
        height: 16px;
        fill: var(--node-color, #3b82f6);
      }
      .node-title {
        font-size: 0.65rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: var(--text);
        line-height: 1;
      }
      .node-sub {
        font-size: 0.58rem;
        color: #334155;
        letter-spacing: 0.2px;
      }

      /* ACTIVE */
      .node.active .node-card {
        border-color: color-mix(in srgb, var(--node-color) 60%, transparent);
        box-shadow:
          0 0 0 1px color-mix(in srgb, var(--node-color) 25%, transparent),
          0 0 32px color-mix(in srgb, var(--node-color) 20%, transparent),
          0 4px 20px rgba(0, 0, 0, 0.5);
      }
      .node.active .node-top-bar {
        opacity: 1;
      }
      .node.active {
        transform: translate(-50%, -50%) scale(1.06);
      }

      /* DONE */
      .node.done .node-card {
        opacity: 0.55;
      }
      .node.done .node-top-bar {
        opacity: 0.15;
      }

      /* ══════════════════════════════════
   SVG EDGES
══════════════════════════════════ */
      .e-base {
        fill: none;
        stroke-width: 1;
        stroke-dasharray: 4 10;
        stroke-linecap: round;
        opacity: 0.1;
      }
      .e-glow {
        fill: none;
        stroke-width: 1.8;
        stroke-dasharray: 10 16;
        stroke-linecap: round;
        opacity: 0;
        filter: url(#glow);
      }
      .e-glow.flowing {
        opacity: 1;
        animation: flow-line 0.8s linear infinite;
      }
      @keyframes flow-line {
        from {
          stroke-dashoffset: 0;
        }
        to {
          stroke-dashoffset: -26;
        }
      }

      /* ══════════════════════════════════
   LAYER LABELS
══════════════════════════════════ */
      .layer-label {
        position: absolute;
        left: 20px;
        font-size: 0.55rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: #1a2744;
        transform: translateY(-50%);
        z-index: 3;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- ══════════════════ LEFT PANEL ══════════════════ -->
      <div id="panel">
        <div id="panel-header">
          <div>
            <div class="panel-logo">
              Tap2Med <span>· System Architecture</span>
            </div>
          </div>
          <div class="panel-badge">Patient Journey</div>
        </div>

        <div id="step-dots"></div>

        <div id="story">
          <div class="step-meta">
            <div class="step-counter" id="step-label">Step 01 of 14</div>
            <div class="step-index" id="step-idx">01</div>
          </div>

          <div id="step-title">—</div>

          <div id="patient-action">
            <div class="pa-avatar">
              <svg viewBox="0 0 24 24">
                <path
                  d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"
                />
              </svg>
            </div>
            <div class="pa-meta">
              <div class="pa-name">Priya Sharma · Token #7</div>
              <div class="pa-text" id="pa-text">—</div>
            </div>
          </div>

          <div id="tech-detail">—</div>

          <div id="code-wrap" class="hidden">
            <div id="code-header">
              <div class="code-dot" style="background: #ef4444"></div>
              <div class="code-dot" style="background: #f59e0b"></div>
              <div class="code-dot" style="background: #10b981"></div>
              <div id="code-lang">Python · Backend</div>
            </div>
            <div id="code-block"></div>
          </div>

          <div id="highlight-box" class="hidden"></div>
        </div>

        <div id="prog-wrap">
          <div id="prog-bar-bg"><div id="prog-bar-fill"></div></div>
        </div>

        <div id="nav">
          <button class="btn-nav" id="btn-prev" onclick="go(-1)" disabled>
            ← Back
          </button>
          <button class="btn-auto" id="btn-auto" onclick="toggleAuto()">
            ▶ Auto Play
          </button>
          <button class="btn-nav" id="btn-next" onclick="go(1)">Next →</button>
        </div>
      </div>

      <!-- ══════════════════ DIAGRAM ══════════════════ -->
      <div id="diagram">
        <!-- Layer labels -->
        <div class="layer-label" id="ll-1">Entry</div>
        <div class="layer-label" id="ll-2">API</div>
        <div class="layer-label" id="ll-3">Security</div>
        <div class="layer-label" id="ll-4">Storage</div>
        <div class="layer-label" id="ll-5">Output</div>

        <svg id="svg-edges">
          <defs>
            <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
              <feGaussianBlur stdDeviation="3.5" result="blur" />
              <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>
        </svg>
      </div>
    </div>

    <script>
      /* ══════════════════════════════════════════════════
   ICONS — clean SVG paths (Material Design-inspired)
══════════════════════════════════════════════════ */
      const ICONS = {
        patient: `<svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>`,
        scan: `<svg viewBox="0 0 24 24"><path d="M3 3h7v7H3zm2 2v3h3V5zm9-2h7v7h-7zm2 2v3h3V5zM3 14h7v7H3zm2 2v3h3v-3zm11 0h2v2h-2zm0 4h2v2h-2zm-2-4h2v6h-2zm4-4h2v2h-2zm0-2h-4v2h4z"/></svg>`,
        api: `<svg viewBox="0 0 24 24"><path d="M4 3h16c.55 0 1 .45 1 1v4c0 .55-.45 1-1 1H4c-.55 0-1-.45-1-1V4c0-.55.45-1 1-1zm12 2.5c0 .55.45 1 1 1s1-.45 1-1-.45-1-1-1-1 .45-1 1zM4 11h16c.55 0 1 .45 1 1v4c0 .55-.45 1-1 1H4c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1zm12 2.5c0 .55.45 1 1 1s1-.45 1-1-.45-1-1-1-1 .45-1 1z"/></svg>`,
        rate: `<svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>`,
        hmac: `<svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>`,
        auth: `<svg viewBox="0 0 24 24"><path d="M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>`,
        db: `<svg viewBox="0 0 24 24"><path d="M12 3C7.58 3 4 4.79 4 7s3.58 4 8 4 8-1.79 8-4-3.58-4-8-4zM4 9v3c0 2.21 3.58 4 8 4s8-1.79 8-4V9c0 2.21-3.58 4-8 4S4 11.21 4 9zm0 5v3c0 2.21 3.58 4 8 4s8-1.79 8-4v-3c0 2.21-3.58 4-8 4S4 16.21 4 14z"/></svg>`,
        doctor: `<svg viewBox="0 0 24 24"><path d="M19 8C19 10.76 17.12 13.09 14.56 13.78L14.56 19C14.56 20.66 13.22 22 11.56 22C9.9 22 8.56 20.66 8.56 19L8.56 13.78C6 13.09 4.12 10.76 4.12 8L4.12 3L6.12 3L6.12 8C6.12 10.21 7.91 12 10.12 12L13 12C15.21 12 17 10.21 17 8L17 3L19 3L19 8ZM9.5 6L9.5 2L11.5 2L11.5 6L9.5 6ZM13.5 6L13.5 2L15.5 2L15.5 6L13.5 6Z"/></svg>`,
        staff: `<svg viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>`,
        pharmacy: `<svg viewBox="0 0 24 24"><path d="M20 6h-2.18c.07-.31.18-.62.18-.94C18 3.37 16.63 2 15.06 2c-.81 0-1.54.34-2.06.88L12 3.77l-1-.89C10.48 2.34 9.75 2 8.94 2 7.37 2 6 3.37 6 4.94c0 .32.1.63.18.94H4C2.9 5.88 2 6.78 2 7.88v12C2 21.1 2.9 22 4 22h16c1.1 0 2-.9 2-2v-12c0-1.1-.9-2-2-2zm-5-2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM9 5c0-.55.45-1 1-1s1 .45 1 1-.45 1-1 1-1-.45-1-1zM4 19.88V8h16v11.88H4zm9-9.38h-2v2H9v2h2v2h2v-2h2v-2h-2v-2z"/></svg>`,
      };

      /* ══════════════════════════════════════════════════
   NODES
══════════════════════════════════════════════════ */
      const NODES = [
        {
          id: "patient",
          cx: 50,
          cy: 8,
          color: "#3b82f6",
          iconKey: "patient",
          title: "Patient",
          sub: "Priya Sharma",
        },
        {
          id: "scan",
          cx: 50,
          cy: 22,

      /* ══════════════════════════════════════════════════
   BUILD NODES
══════════════════════════════════════════════════ */
      const diagramEl = document.getElementById("diagram");
      const svgEl = document.getElementById("svg-edges");
      const nodeEls = {};

      function dw() {
        return diagramEl.offsetWidth;
      }
      function dh() {
        return diagramEl.offsetHeight;
      }
      function px(pct, total) {
        return (total * pct) / 100;
      }

      function buildNodes() {
        document.querySelectorAll(".node").forEach((e) => e.remove());
        NODES.forEach((n) => {
          const div = document.createElement("div");
          div.className = "node";
          div.id = "n-" + n.id;
          div.style.setProperty("--node-color", n.color);
          div.style.left = px(n.cx, dw()) + "px";
          div.style.top = px(n.cy, dh()) + "px";
          div.innerHTML = `
      <div class="node-card">
        <div class="node-top-bar"></div>
        <div class="node-body">
          <div class="node-icon-wrap" style="--node-color:${n.color}">${ICONS[n.iconKey] || ""}</div>
          <div class="node-title">${n.title}</div>
          <div class="node-sub">${n.sub}</div>
        </div>
      </div>`;
          diagramEl.appendChild(div);
          nodeEls[n.id] = div;
        });
        positionLayerLabels();
      }

      function positionLayerLabels() {
        const layers = [
          { id: "ll-1", nodeId: "patient" },
          { id: "ll-2", nodeId: "api" },
          { id: "ll-3", nodeId: "hmac" },
          { id: "ll-4", nodeId: "db" },
          { id: "ll-5", nodeId: "staff" },
        ];
        const dr = diagramEl.getBoundingClientRect();
        layers.forEach((l) => {
          const el = document.getElementById(l.id);
          const n = nodeEls[l.nodeId];
          if (!el || !n) return;
          const nr = n.getBoundingClientRect();
          el.style.top = nr.top + nr.height / 2 - dr.top + "px";
        });
      }

      /* ══════════════════════════════════════════════════
   BUILD SVG EDGES
══════════════════════════════════════════════════ */
      function nodePort(id, side) {
        const el = nodeEls[id];
        if (!el) return { x: 0, y: 0 };
        const dr = diagramEl.getBoundingClientRect();
        const er = el.getBoundingClientRect();
        const cx = er.left + er.width / 2 - dr.left;
        const cy = side === "top" ? er.top - dr.top : er.bottom - dr.top;
        return { x: cx, y: cy };
      }

      function buildEdges() {
        svgEl.querySelectorAll(".e-base,.e-glow").forEach((e) => e.remove());
        EDGES.forEach((edge) => {
          const s = nodePort(edge.from, "bottom");
          const e = nodePort(edge.to, "top");
          const dy = Math.abs(e.y - s.y);
          const t = Math.min(dy * 0.45, 70);
          const d = `M ${s.x} ${s.y} C ${s.x} ${s.y + t} ${e.x} ${e.y - t} ${e.x} ${e.y}`;

          const base = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path",
          );
          base.setAttribute("d", d);
          base.setAttribute("class", "e-base");
          base.setAttribute("stroke", edge.color);
          base.id = "base-" + edge.id;
          svgEl.appendChild(base);

          const glow = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path",
          );
          glow.setAttribute("d", d);
          glow.setAttribute("class", "e-glow");
          glow.setAttribute("stroke", edge.color);
          glow.id = "glow-" + edge.id;
          svgEl.appendChild(glow);
        });
      }

      /* ══════════════════════════════════════════════════
   STEP RENDERER
══════════════════════════════════════════════════ */
      let currentStep = 0;
      let autoTimer = null;
      let progTimer = null;
      let progPct = 0;
      const AUTO_DUR = 5500;

      function renderStep(idx) {
        const step = STEPS[idx];

        // dots
        document.querySelectorAll(".dot").forEach((d, i) => {
          d.classList.toggle("active", i === idx);
          d.classList.toggle("done", i < idx);
        });

        // counter
        const n = String(idx + 1).padStart(2, "0");
        document.getElementById("step-label").textContent =
          `Step ${n} of ${STEPS.length}`;
        document.getElementById("step-idx").textContent = n;
        document.getElementById("step-title").textContent = step.title;
        document.getElementById("pa-text").textContent = step.pa;
        document.getElementById("tech-detail").textContent = step.tech;

        // code
        const cw = document.getElementById("code-wrap");
        const cb = document.getElementById("code-block");
        const cl = document.getElementById("code-lang");
        if (step.code) {
          cb.innerHTML = step.code;
          cl.textContent = step.codeFile || "Python · Backend";
          cw.classList.remove("hidden");
        } else {
          cw.classList.add("hidden");
        }

        // highlight
        const hb = document.getElementById("highlight-box");
        if (step.highlight) {
          hb.style.background = step.highlight.color + "12";
          hb.style.borderColor = step.highlight.color + "40";
          hb.style.color = step.highlight.color;
          hb.textContent = step.highlight.text;
          hb.classList.remove("hidden");
        } else {
          hb.classList.add("hidden");
        }

        // nodes
        NODES.forEach((n) => {
          const el = nodeEls[n.id];
          if (!el) return;
          el.classList.remove("active", "done");
          if (step.nodes.includes(n.id)) el.classList.add("active");
          else if (STEPS.slice(0, idx).some((s) => s.nodes.includes(n.id)))
            el.classList.add("done");
        });

        // edges
        EDGES.forEach((edge) => {
          const g = document.getElementById("glow-" + edge.id);
          const b = document.getElementById("base-" + edge.id);
          const on = step.edges.includes(edge.id);
          if (g) g.classList.toggle("flowing", on);
          if (b) b.style.opacity = on ? "0.25" : "0.1";
        });

        document.getElementById("btn-prev").disabled = idx === 0;
        document.getElementById("btn-next").disabled = idx === STEPS.length - 1;
      }

      function go(dir) {
        const next = currentStep + dir;
        if (next < 0 || next >= STEPS.length) return;
        currentStep = next;
        renderStep(currentStep);
        if (autoTimer) resetProgress();
      }

      /* ══════════════════════════════════════════════════
   AUTO PLAY
══════════════════════════════════════════════════ */
      function startProgress() {
        progPct = 0;
        clearInterval(progTimer);
        const step = 60;
        progTimer = setInterval(() => {
          progPct += (step / AUTO_DUR) * 100;
          document.getElementById("prog-bar-fill").style.width =
            Math.min(progPct, 100) + "%";
          if (progPct >= 100) {
            clearInterval(progTimer);
            if (currentStep < STEPS.length - 1) {
              go(1);
              startProgress();
            } else stopAuto();
          }
        }, step);
      }

      function resetProgress() {
        progPct = 0;
        document.getElementById("prog-bar-fill").style.width = "0%";
        clearInterval(progTimer);
        if (autoTimer) startProgress();
      }

      function startAuto() {
        autoTimer = true;
        document.getElementById("btn-auto").textContent = "⏸  Pause";
        document.getElementById("btn-auto").style.background = "#1e293b";
        startProgress();
      }

      function stopAuto() {
        autoTimer = null;
        clearInterval(progTimer);
        document.getElementById("btn-auto").textContent = "▶  Auto Play";
        document.getElementById("btn-auto").style.background = "var(--blue)";
        document.getElementById("prog-bar-fill").style.width = "0%";
      }

      function toggleAuto() {
        if (autoTimer) stopAuto();
        else startAuto();
      }

      /* ══════════════════════════════════════════════════
   DOTS
══════════════════════════════════════════════════ */
      function buildDots() {
        const c = document.getElementById("step-dots");
        c.innerHTML = "";
        STEPS.forEach((_, i) => {
          const d = document.createElement("div");
          d.className = "dot";
          d.title = `Step ${i + 1}`;
          d.onclick = () => {
            currentStep = i;
            renderStep(i);
            if (autoTimer) resetProgress();
          };
          c.appendChild(d);
        });
      }

      /* ══════════════════════════════════════════════════
   RESIZE
══════════════════════════════════════════════════ */
      window.addEventListener("resize", () => {
        NODES.forEach((n) => {
          const el = nodeEls[n.id];
          if (el) {
            el.style.left = px(n.cx, dw()) + "px";
            el.style.top = px(n.cy, dh()) + "px";
          }
        });
        requestAnimationFrame(() => {
          buildEdges();
          positionLayerLabels();
        });
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight" || e.key === " ") {
          e.preventDefault();
          go(1);
        }
        if (e.key === "ArrowLeft") {
          e.preventDefault();
          go(-1);
        }
      });

      /* ══════════════════════════════════════════════════
   BOOT
══════════════════════════════════════════════════ */
      function init() {
        buildNodes();
        requestAnimationFrame(() => {
          buildEdges();
          buildDots();
          renderStep(0);
        });
      }
      init();
    </script>
