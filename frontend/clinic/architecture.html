<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Tap2Med — Architecture</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05080f;
        font-family: "Segoe UI", system-ui, sans-serif;
      }

      canvas#bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
      }
      canvas#flow {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
      }

      #stage {
        position: relative;
        z-index: 2;
        width: 100vw;
        height: 100vh;
      }

      /* ── TOP BAR ── */
      #topbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 32px;
        height: 56px;
        background: rgba(5, 8, 15, 0.8);
        backdrop-filter: blur(16px);
        border-bottom: 1px solid rgba(14, 165, 233, 0.15);
        z-index: 10;
      }
      .logo {
        font-size: 1rem;
        font-weight: 800;
        color: #0ea5e9;
        letter-spacing: -0.5px;
      }
      .logo span {
        color: #94a3b8;
      }
      .tagline {
        font-size: 0.72rem;
        color: #334155;
        text-transform: uppercase;
        letter-spacing: 2px;
      }
      .btn-sim {
        background: linear-gradient(135deg, #0ea5e9, #6366f1);
        border: none;
        color: #fff;
        padding: 8px 20px;
        border-radius: 20px;
        font-size: 0.8rem;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 0 20px rgba(14, 165, 233, 0.3);
        transition:
          transform 0.15s,
          box-shadow 0.15s;
        letter-spacing: 0.3px;
      }
      .btn-sim:hover {
        transform: scale(1.05);
        box-shadow: 0 0 32px rgba(14, 165, 233, 0.5);
      }
      .btn-sim:active {
        transform: scale(0.97);
      }

      /* ── NODES ── */
      .node {
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: center;
        transform: translate(-50%, -50%);
        cursor: default;
        transition: transform 0.2s;
      }
      .node:hover {
        transform: translate(-50%, -50%) scale(1.06);
      }

      .node-card {
        background: rgba(15, 23, 42, 0.85);
        border-radius: 16px;
        padding: 14px 18px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(12px);
        text-align: center;
        min-width: 110px;
        position: relative;
        overflow: hidden;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
        transition:
          border-color 0.3s,
          box-shadow 0.3s;
      }

      .node-card::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 16px;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.04),
          transparent
        );
        pointer-events: none;
      }

      .node.active .node-card {
        animation: node-pulse 0.4s ease-out;
      }

      @keyframes node-pulse {
        0% {
          transform: scale(1);
        }
        40% {
          transform: scale(1.08);
        }
        100% {
          transform: scale(1);
        }
      }

      .node-icon {
        font-size: 1.6rem;
        margin-bottom: 6px;
        display: block;
      }
      .node-title {
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: #e2e8f0;
        margin-bottom: 2px;
      }
      .node-sub {
        font-size: 0.63rem;
        color: #475569;
        letter-spacing: 0.3px;
      }

      /* color accents per type */
      .node[data-type="patient"] .node-card {
        border-color: rgba(14, 165, 233, 0.4);
        box-shadow: 0 4px 32px rgba(14, 165, 233, 0.15);
      }
      .node[data-type="scan"] .node-card {
        border-color: rgba(99, 102, 241, 0.4);
        box-shadow: 0 4px 32px rgba(99, 102, 241, 0.15);
      }
      .node[data-type="api"] .node-card {
        border-color: rgba(245, 158, 11, 0.4);
        box-shadow: 0 4px 32px rgba(245, 158, 11, 0.15);
      }
      .node[data-type="hmac"] .node-card {
        border-color: rgba(168, 85, 247, 0.5);
        box-shadow: 0 4px 40px rgba(168, 85, 247, 0.25);
      }
      .node[data-type="rate"] .node-card {
        border-color: rgba(239, 68, 68, 0.4);
        box-shadow: 0 4px 32px rgba(239, 68, 68, 0.15);
      }
      .node[data-type="auth"] .node-card {
        border-color: rgba(16, 185, 129, 0.4);
        box-shadow: 0 4px 32px rgba(16, 185, 129, 0.15);
      }
      .node[data-type="db"] .node-card {
        border-color: rgba(6, 182, 212, 0.4);
        box-shadow: 0 4px 40px rgba(6, 182, 212, 0.25);
      }
      .node[data-type="doctor"] .node-card {
        border-color: rgba(14, 165, 233, 0.35);
        box-shadow: 0 4px 24px rgba(14, 165, 233, 0.1);
      }
      .node[data-type="staff"] .node-card {
        border-color: rgba(99, 102, 241, 0.35);
        box-shadow: 0 4px 24px rgba(99, 102, 241, 0.1);
      }
      .node[data-type="pharmacy"] .node-card {
        border-color: rgba(16, 185, 129, 0.35);
        box-shadow: 0 4px 24px rgba(16, 185, 129, 0.1);
      }

      /* glow ring */
      .node-ring {
        position: absolute;
        inset: -8px;
        border-radius: 22px;
        border: 1px solid transparent;
        pointer-events: none;
        animation: none;
      }
      .node.active .node-ring {
        animation: ring-expand 0.5s ease-out forwards;
      }
      @keyframes ring-expand {
        0% {
          inset: -4px;
          opacity: 0.9;
          border-color: inherit;
        }
        100% {
          inset: -18px;
          opacity: 0;
          border-color: inherit;
        }
      }

      /* ── LABELS ── */
      .edge-label {
        position: absolute;
        transform: translate(-50%, -50%);
        font-size: 0.6rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        padding: 3px 8px;
        border-radius: 6px;
        pointer-events: none;
        z-index: 3;
        opacity: 0.85;
      }

      /* ── STATS BAR ── */
      #statsbar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 48px;
        padding: 12px 32px;
        height: 52px;
        background: rgba(5, 8, 15, 0.85);
        backdrop-filter: blur(16px);
        border-top: 1px solid rgba(255, 255, 255, 0.04);
        z-index: 10;
      }
      .stat {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .stat-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
      .stat-val {
        font-size: 1rem;
        font-weight: 800;
        color: #e2e8f0;
      }
      .stat-key {
        font-size: 0.7rem;
        color: #475569;
        text-transform: uppercase;
        letter-spacing: 0.8px;
      }

      /* ── HASH TOOLTIP ── */
      #hashtooltip {
        position: fixed;
        background: rgba(10, 14, 26, 0.97);
        border: 1px solid rgba(168, 85, 247, 0.4);
        border-radius: 12px;
        padding: 16px 20px;
        font-family: "Cascadia Code", "Fira Code", monospace;
        font-size: 0.7rem;
        line-height: 2;
        pointer-events: none;
        z-index: 20;
        opacity: 0;
        transition: opacity 0.25s;
        box-shadow:
          0 8px 32px rgba(0, 0, 0, 0.6),
          0 0 32px rgba(168, 85, 247, 0.15);
        max-width: 360px;
      }
      #hashtooltip.show {
        opacity: 1;
      }
      .ht-row {
        display: flex;
        gap: 10px;
        align-items: baseline;
      }
      .ht-label {
        color: #475569;
        width: 110px;
        flex-shrink: 0;
      }
      .ht-val-phone {
        color: #ef4444;
        text-decoration: line-through;
      }
      .ht-val-hash {
        color: #a855f7;
        word-break: break-all;
      }
      .ht-val-local {
        color: #10b981;
      }
      .ht-val-net {
        color: #f59e0b;
      }

      /* ── LAYER LABELS ── */
      .layer-label {
        position: absolute;
        right: calc(50% + 420px);
        font-size: 0.62rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        color: #1e293b;
        transform: translateY(-50%);
        white-space: nowrap;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .layer-label::after {
        content: "";
        width: 24px;
        height: 1px;
        background: currentColor;
      }
    </style>
  </head>
  <body>
    <canvas id="bg"></canvas>
    <canvas id="flow"></canvas>

    <div id="topbar">
      <div>
        <div class="logo">Tap2Med <span>· System Architecture</span></div>
      </div>
      <div class="tagline">India Health Protocol · Privacy by Design</div>
      <button class="btn-sim" onclick="triggerManualFlow()">
        ▶ Simulate Patient Visit
      </button>
    </div>

    <div id="stage">
      <!-- Nodes injected by JS -->
    </div>

    <div id="hashtooltip">
      <div class="ht-row">
        <span class="ht-label">phone input</span
        ><span class="ht-val-phone" id="ht-phone">9876543210</span>
      </div>
      <div class="ht-row">
        <span class="ht-label">stored in DB</span
        ><span style="color: #ef4444; font-size: 0.65rem"
          >❌ never persisted</span
        >
      </div>
      <div class="ht-row">
        <span class="ht-label">lookup_hash</span
        ><span class="ht-val-hash" id="ht-lookup">computing…</span>
      </div>
      <div class="ht-row">
        <span class="ht-label">local_token</span
        ><span class="ht-val-local" id="ht-local">computing…</span>
      </div>
      <div class="ht-row">
        <span class="ht-label">network_token</span
        ><span class="ht-val-net" id="ht-net">computing…</span>
      </div>
    </div>

    <div id="statsbar">
      <div class="stat">
        <div
          class="stat-dot"
          style="background: #0ea5e9; box-shadow: 0 0 8px #0ea5e9"
        ></div>
        <div class="stat-val" id="s-patients">0</div>
        <div class="stat-key">Patients Processed</div>
      </div>
      <div class="stat">
        <div
          class="stat-dot"
          style="background: #a855f7; box-shadow: 0 0 8px #a855f7"
        ></div>
        <div class="stat-val" id="s-hashes">0</div>
        <div class="stat-key">Hashes Generated</div>
      </div>
      <div class="stat">
        <div
          class="stat-dot"
          style="background: #10b981; box-shadow: 0 0 8px #10b981"
        ></div>
        <div class="stat-val" id="s-rx">0</div>
        <div class="stat-key">Prescriptions</div>
      </div>
      <div class="stat">
        <div
          class="stat-dot"
          style="background: #ef4444; box-shadow: 0 0 8px #ef4444"
        ></div>
        <div class="stat-val">0</div>
        <div class="stat-key">Phone Numbers Stored</div>
      </div>
    </div>

    <script>
      /* ═══════════════════════════════════════════════════════════
   NODES DEFINITION
═══════════════════════════════════════════════════════════ */
      // positions: percentages of viewport (cx, cy)
      const NODES = [
        // Row 1 — Patient entry
        {
          id: "patient",
          cx: 50,
          cy: 14,
          type: "patient",
          icon: "📱",
          title: "Patient",
          sub: "Scan QR · No app needed",
        },

        // Row 2 — Entry layer
        {
          id: "scan",
          cx: 50,
          cy: 28,
          type: "scan",
          icon: "🔍",
          title: "QR Scan Entry",
          sub: "/scan endpoint",
        },

        // Row 3 — API
        {
          id: "api",
          cx: 50,
          cy: 42,
          type: "api",
          icon: "⚡",
          title: "FastAPI Backend",
          sub: "Gunicorn + Uvicorn",
        },

        // Row 4 — Security layer (3 nodes)
        {
          id: "rate",
          cx: 20,
          cy: 57,
          type: "rate",
          icon: "🚫",
          title: "Rate Limiter",
          sub: "5 req/IP/hr",
        },
        {
          id: "hmac",
          cx: 50,
          cy: 57,
          type: "hmac",
          icon: "🔐",
          title: "HMAC Engine",
          sub: "SHA-256 · 3 tokens",
        },
        {
          id: "auth",
          cx: 80,
          cy: 57,
          type: "auth",
          icon: "🔑",
          title: "Auth · OTP",
          sub: "PBKDF2 200k iter",
        },

        // Row 5 — Database
        {
          id: "db",
          cx: 50,
          cy: 72,
          type: "db",
          icon: "🗄️",
          title: "PostgreSQL",
          sub: "6 tables · UUID PKs · JSONB",
        },

        // Row 6 — Output layer
        {
          id: "doctor",
          cx: 25,
          cy: 86,
          type: "doctor",
          icon: "👨‍⚕️",
          title: "Doctor",
          sub: "Dashboard · Rx Pad",
        },
        {
          id: "staff",
          cx: 50,
          cy: 86,
          type: "staff",
          icon: "🩺",
          title: "Staff",
          sub: "Queue · Vitals",
        },
        {
          id: "pharmacy",
          cx: 75,
          cy: 86,
          type: "pharmacy",
          icon: "💊",
          title: "Pharmacy",
          sub: "Dispense view",
        },
      ];

      /* ═══════════════════════════════════════════════════════════
   EDGES DEFINITION  {from, to, color, label, dash, delay}
═══════════════════════════════════════════════════════════ */
      const EDGES = [
        // main spine
        {
          from: "patient",
          to: "scan",
          color: "#0ea5e9",
          label: "phone + QR",
          packet: true,
          autoRate: 2200,
        },
        {
          from: "scan",
          to: "api",
          color: "#6366f1",
          label: "POST /visit",
          packet: true,
          autoRate: 2600,
        },
        {
          from: "api",
          to: "rate",
          color: "#ef4444",
          label: "check IP",
          packet: true,
          autoRate: 3100,
          dash: [4, 6],
        },
        {
          from: "api",
          to: "hmac",
          color: "#a855f7",
          label: "hash phone",
          packet: true,
          autoRate: 2000,
        },
        {
          from: "api",
          to: "auth",
          color: "#10b981",
          label: "verify token",
          packet: true,
          autoRate: 4000,
          dash: [4, 6],
        },
        {
          from: "hmac",
          to: "db",
          color: "#a855f7",
          label: "token only",
          packet: true,
          autoRate: 1800,
        },
        {
          from: "db",
          to: "doctor",
          color: "#0ea5e9",
          label: "history",
          packet: true,
          autoRate: 3500,
        },
        {
          from: "db",
          to: "staff",
          color: "#6366f1",
          label: "queue",
          packet: true,
          autoRate: 2800,
        },
        {
          from: "db",
          to: "pharmacy",
          color: "#10b981",
          label: "Rx",
          packet: true,
          autoRate: 4500,
        },
        {
          from: "auth",
          to: "db",
          color: "#10b981",
          label: "session",
          packet: true,
          autoRate: 5000,
          dash: [4, 6],
        },
      ];

      /* ═══════════════════════════════════════════════════════════
   LAYOUT + DOM
═══════════════════════════════════════════════════════════ */
      const stage = document.getElementById("stage");
      const nodeEls = {};

      function cx(pct) {
        return (window.innerWidth * pct) / 100;
      }
      function cy(pct) {
        return ((window.innerHeight - 56 - 52) * pct) / 100 + 56;
      }

      function buildNodes() {
        stage.innerHTML = "";
        NODES.forEach((n) => {
          const el = document.createElement("div");
          el.className = "node";
          el.id = "node-" + n.id;
          el.dataset.type = n.type;
          el.style.left = cx(n.cx) + "px";
          el.style.top = cy(n.cy) + "px";
          el.innerHTML = `
      <div class="node-card">
        <div class="node-ring" id="ring-${n.id}"></div>
        <span class="node-icon">${n.icon}</span>
        <div class="node-title">${n.title}</div>
        <div class="node-sub">${n.sub}</div>
      </div>`;
          stage.appendChild(el);
          nodeEls[n.id] = el;

          // hover on HMAC node → show tooltip
          if (n.id === "hmac") {
            el.style.cursor = "pointer";
            el.addEventListener("mouseenter", showHashTooltip);
            el.addEventListener("mouseleave", hideHashTooltip);
          }
        });
      }

      /* ═══════════════════════════════════════════════════════════
   BG CANVAS — grid + subtle stars
═══════════════════════════════════════════════════════════ */
      const bgCanvas = document.getElementById("bg");
      const bgCtx = bgCanvas.getContext("2d");
      let stars = [];

      function initBg() {
        bgCanvas.width = window.innerWidth;
        bgCanvas.height = window.innerHeight;
        stars = Array.from({ length: 60 }, () => ({
          x: Math.random() * bgCanvas.width,
          y: Math.random() * bgCanvas.height,
          r: Math.random() * 1.5,
          a: Math.random(),
          speed: 0.002 + Math.random() * 0.003,
        }));
      }

      function drawBg() {
        const c = bgCtx;
        c.clearRect(0, 0, bgCanvas.width, bgCanvas.height);

        // grid
        c.strokeStyle = "rgba(14,165,233,0.04)";
        c.lineWidth = 1;
        const gs = 48;
        for (let x = 0; x < bgCanvas.width; x += gs) {
          c.beginPath();
          c.moveTo(x, 0);
          c.lineTo(x, bgCanvas.height);
          c.stroke();
        }
        for (let y = 0; y < bgCanvas.height; y += gs) {
          c.beginPath();
          c.moveTo(0, y);
          c.lineTo(bgCanvas.width, y);
          c.stroke();
        }

        // stars
        stars.forEach((s) => {
          s.a += s.speed;
          const alpha = ((Math.sin(s.a) + 1) / 2) * 0.4 + 0.05;
          c.beginPath();
          c.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          c.fillStyle = `rgba(148,163,184,${alpha})`;
          c.fill();
        });

        requestAnimationFrame(drawBg);
      }

      /* ═══════════════════════════════════════════════════════════
   FLOW CANVAS — edges + animated packets
═══════════════════════════════════════════════════════════ */
      const flowCanvas = document.getElementById("flow");
      const flowCtx = flowCanvas.getContext("2d");

      // live packets: {sx,sy,ex,ey,progress,color,size,trail}
      let packets = [];

      function getNodeCenter(id) {
        const n = NODES.find((x) => x.id === id);
        return { x: cx(n.cx), y: cy(n.cy) };
      }

      function getEdgeControlPoint(s, e) {
        // slight curve
        const mx = (s.x + e.x) / 2;
        const my = (s.y + e.y) / 2;
        const dx = e.x - s.x,
          dy = e.y - s.y;
        const perp = { x: -dy, y: dx };
        const len = Math.sqrt(perp.x ** 2 + perp.y ** 2);
        const off = 30;
        return { x: mx + (perp.x / len) * off, y: my + (perp.y / len) * off };
      }

      function bezier(t, sx, sy, cx_, cy_, ex, ey) {
        const mt = 1 - t;
        return {
          x: mt * mt * sx + 2 * mt * t * cx_ + t * t * ex,
          y: mt * mt * sy + 2 * mt * t * cy_ + t * t * ey,
        };
      }

      function spawnPacket(edge, fromId, toId) {
        const s = getNodeCenter(fromId);
        const e = getNodeCenter(toId);
        const cp = getEdgeControlPoint(s, e);
        packets.push({
          sx: s.x,
          sy: s.y,
          ex: e.x,
          ey: e.y,
          cpx: cp.x,
          cpy: cp.y,
          progress: 0,
          speed: 0.008 + Math.random() * 0.005,
          color: edge.color,
          size: 5 + Math.random() * 3,
          trail: [],
          toId,
          fromId,
        });
      }

      function drawEdges() {
        const c = flowCtx;
        EDGES.forEach((edge) => {
          const s = getNodeCenter(edge.from);
          const e = getNodeCenter(edge.to);
          const cp = getEdgeControlPoint(s, e);

          c.beginPath();
          if (edge.dash) c.setLineDash(edge.dash);
          else c.setLineDash([]);

          const col = edge.color;
          c.strokeStyle = col + "28";
          c.lineWidth = 1.5;
          c.moveTo(s.x, s.y);
          c.quadraticCurveTo(cp.x, cp.y, e.x, e.y);
          c.stroke();
          c.setLineDash([]);
        });
      }

      function drawPackets() {
        const c = flowCtx;
        packets.forEach((p) => {
          // trail
          p.trail.forEach((pt, i) => {
            const alpha = (i / p.trail.length) * 0.6;
            const r = p.size * (i / p.trail.length) * 0.7;
            c.beginPath();
            c.arc(pt.x, pt.y, r, 0, Math.PI * 2);
            c.fillStyle =
              p.color +
              Math.floor(alpha * 255)
                .toString(16)
                .padStart(2, "0");
            c.fill();
          });

          // head
          const pos = bezier(p.progress, p.sx, p.sy, p.cpx, p.cpy, p.ex, p.ey);

          const grd = c.createRadialGradient(
            pos.x,
            pos.y,
            0,
            pos.x,
            pos.y,
            p.size * 2,
          );
          grd.addColorStop(0, p.color + "ff");
          grd.addColorStop(0.4, p.color + "aa");
          grd.addColorStop(1, p.color + "00");
          c.beginPath();
          c.arc(pos.x, pos.y, p.size * 2, 0, Math.PI * 2);
          c.fillStyle = grd;
          c.fill();

          c.beginPath();
          c.arc(pos.x, pos.y, p.size * 0.5, 0, Math.PI * 2);
          c.fillStyle = "#ffffff";
          c.fill();

          p.trail.push({ x: pos.x, y: pos.y });
          if (p.trail.length > 18) p.trail.shift();
          p.progress += p.speed;
        });

        // remove finished + pulse destination
        packets = packets.filter((p) => {
          if (p.progress >= 1) {
            pulseNode(p.toId);
            updateStats(p.toId);
            return false;
          }
          return true;
        });
      }

      function flowLoop() {
        flowCanvas.width = window.innerWidth;
        flowCanvas.height = window.innerHeight;
        drawEdges();
        drawPackets();
        requestAnimationFrame(flowLoop);
      }

      /* ═══════════════════════════════════════════════════════════
   AUTO SPAWN
═══════════════════════════════════════════════════════════ */
      function startAutoSpawn() {
        EDGES.forEach((edge) => {
          if (!edge.autoRate) return;
          // initial offset
          setTimeout(function spawnLoop() {
            spawnPacket(edge, edge.from, edge.to);
            setTimeout(spawnLoop, edge.autoRate + Math.random() * 1000 - 500);
          }, Math.random() * edge.autoRate);
        });
      }

      /* ═══════════════════════════════════════════════════════════
   MANUAL SIMULATION
═══════════════════════════════════════════════════════════ */
      function triggerManualFlow() {
        const chain = [
          ["patient", "scan", 0],
          ["scan", "api", 400],
          ["api", "rate", 900],
          ["api", "hmac", 900],
          ["api", "auth", 1200],
          ["hmac", "db", 1500],
          ["auth", "db", 2000],
          ["db", "doctor", 2500],
          ["db", "staff", 2700],
          ["db", "pharmacy", 2900],
        ];
        chain.forEach(([f, t, d]) => {
          const edge = EDGES.find((e) => e.from === f && e.to === t) || {
            color: "#0ea5e9",
          };
          setTimeout(() => spawnPacket(edge, f, t), d);
        });
      }

      /* ═══════════════════════════════════════════════════════════
   NODE PULSE
═══════════════════════════════════════════════════════════ */
      function pulseNode(id) {
        const el = nodeEls[id];
        if (!el) return;
        el.classList.remove("active");
        void el.offsetWidth;
        el.classList.add("active");
        setTimeout(() => el.classList.remove("active"), 600);
      }

      /* ═══════════════════════════════════════════════════════════
   STATS COUNTERS
═══════════════════════════════════════════════════════════ */
      let counts = { patients: 0, hashes: 0, rx: 0 };
      function updateStats(toId) {
        if (toId === "scan" || toId === "api") {
          counts.patients++;
          document.getElementById("s-patients").textContent = counts.patients;
        }
        if (toId === "hmac" || toId === "db") {
          counts.hashes++;
          document.getElementById("s-hashes").textContent = counts.hashes;
        }
        if (toId === "pharmacy") {
          counts.rx++;
          document.getElementById("s-rx").textContent = counts.rx;
        }
      }

      /* ═══════════════════════════════════════════════════════════
   HASH TOOLTIP (HMAC node hover)
═══════════════════════════════════════════════════════════ */
      const tooltip = document.getElementById("hashtooltip");
      let tooltipVisible = false;

      async function sha256hex(msg) {
        const buf = await crypto.subtle.digest(
          "SHA-256",
          new TextEncoder().encode(msg),
        );
        return [...new Uint8Array(buf)]
          .map((b) => b.toString(16).padStart(2, "0"))
          .join("");
      }

      async function showHashTooltip(e) {
        const phone = "9876543210";
        const lh = await sha256hex(`tap2med_secret:${phone}:0`);
        const lt = await sha256hex(`tap2med_secret:clinic_salt_xyz:${phone}:0`);
        const nt = await sha256hex(`tap2med_secret:user_salt_abc:${phone}:0`);

        document.getElementById("ht-phone").textContent = phone;
        document.getElementById("ht-lookup").textContent =
          lh.slice(0, 32) + "…";
        document.getElementById("ht-local").textContent = lt.slice(0, 32) + "…";
        document.getElementById("ht-net").textContent = nt.slice(0, 32) + "…";

        const rect = nodeEls["hmac"].getBoundingClientRect();
        tooltip.style.left = rect.right + 16 + "px";
        tooltip.style.top = rect.top + "px";
        tooltip.classList.add("show");
      }

      function hideHashTooltip() {
        tooltip.classList.remove("show");
      }

      /* ═══════════════════════════════════════════════════════════
   RESIZE
═══════════════════════════════════════════════════════════ */
      function onResize() {
        initBg();
        buildNodes();
      }

      /* ═══════════════════════════════════════════════════════════
   BOOT
═══════════════════════════════════════════════════════════ */
      window.addEventListener("resize", onResize);

      buildNodes();
      initBg();
      drawBg();
      flowLoop();

      // initial burst after short delay
      setTimeout(() => {
        startAutoSpawn();
        triggerManualFlow(); // fire the first simulation instantly on load
      }, 600);
    </script>
  </body>
</html>
