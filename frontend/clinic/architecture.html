<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Tap2Med — Patient Journey</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #060912;
        --panel-w: 400px;
        --blue: #0ea5e9;
        --indigo: #6366f1;
        --amber: #f59e0b;
        --red: #ef4444;
        --purple: #a855f7;
        --green: #10b981;
        --cyan: #06b6d4;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        color: #e2e8f0;
      }

      /* ── ROOT LAYOUT ── */
      #root {
        display: flex;
        width: 100vw;
        height: 100vh;
      }

      /* ── LEFT PANEL ── */
      #panel {
        width: var(--panel-w);
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        background: rgba(10, 14, 26, 0.97);
        border-right: 1px solid rgba(255, 255, 255, 0.05);
        position: relative;
        z-index: 10;
      }

      #panel-header {
        padding: 24px 28px 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        flex-shrink: 0;
      }
      .panel-logo {
        font-size: 0.85rem;
        font-weight: 800;
        color: var(--blue);
        margin-bottom: 2px;
      }
      .panel-logo span {
        color: #475569;
      }
      .panel-sub {
        font-size: 0.7rem;
        color: #334155;
        text-transform: uppercase;
        letter-spacing: 1.5px;
      }

      /* step dots */
      #step-dots {
        display: flex;
        gap: 6px;
        padding: 16px 28px 0;
        flex-shrink: 0;
        flex-wrap: wrap;
      }
      .dot {
        width: 20px;
        height: 4px;
        border-radius: 2px;
        background: #1e293b;
        transition:
          background 0.3s,
          width 0.3s;
        cursor: pointer;
      }
      .dot.done {
        background: #334155;
      }
      .dot.active {
        background: var(--blue);
        width: 32px;
        box-shadow: 0 0 8px var(--blue);
      }

      /* main story area */
      #story {
        flex: 1;
        overflow-y: auto;
        padding: 20px 28px 24px;
        display: flex;
        flex-direction: column;
        gap: 0;
      }
      #story::-webkit-scrollbar {
        width: 3px;
      }
      #story::-webkit-scrollbar-track {
        background: transparent;
      }
      #story::-webkit-scrollbar-thumb {
        background: #1e293b;
        border-radius: 3px;
      }

      .step-num {
        font-size: 0.65rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .step-num::after {
        content: "";
        flex: 1;
        height: 1px;
        background: rgba(255, 255, 255, 0.05);
      }

      #step-title {
        font-size: 1.45rem;
        font-weight: 800;
        line-height: 1.25;
        letter-spacing: -0.5px;
        margin-bottom: 12px;
      }

      #patient-action {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 14px;
      }
      .pa-avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: linear-gradient(135deg, #0ea5e9, #6366f1);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1rem;
        flex-shrink: 0;
      }
      .pa-name {
        font-size: 0.7rem;
        font-weight: 700;
        color: var(--blue);
        margin-bottom: 3px;
      }
      .pa-text {
        font-size: 0.85rem;
        color: #94a3b8;
        line-height: 1.5;
      }

      #tech-detail {
        font-size: 0.78rem;
        color: #475569;
        line-height: 1.7;
        margin-bottom: 14px;
      }

      #code-block {
        background: #0d1117;
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 10px;
        padding: 14px 16px;
        font-family: "Cascadia Code", "Fira Code", monospace;
        font-size: 0.72rem;
        line-height: 1.8;
        overflow-x: auto;
        transition: opacity 0.3s;
      }
      #code-block.hidden {
        display: none;
      }
      .c-comment {
        color: #3d4f6b;
      }
      .c-key {
        color: #ff7b72;
      }
      .c-fn {
        color: #d2a8ff;
      }
      .c-str {
        color: #a5d6ff;
      }
      .c-val {
        color: #79c0ff;
      }
      .c-result {
        color: #10b981;
        font-weight: 600;
      }
      .c-del {
        color: #ef4444;
        text-decoration: line-through;
      }

      /* highlight box */
      #highlight-box {
        border-radius: 10px;
        padding: 12px 14px;
        font-size: 0.8rem;
        line-height: 1.6;
        border: 1px solid transparent;
        transition: opacity 0.3s;
        margin-top: 12px;
      }
      #highlight-box.hidden {
        display: none;
      }

      /* progress bar */
      #prog-wrap {
        padding: 0 28px 12px;
        flex-shrink: 0;
      }
      #prog-bar-bg {
        height: 3px;
        background: #0f172a;
        border-radius: 2px;
        overflow: hidden;
      }
      #prog-bar-fill {
        height: 100%;
        border-radius: 2px;
        width: 0%;
        background: linear-gradient(90deg, var(--blue), var(--purple));
        transition: width 0.1s linear;
      }

      /* navigation */
      #nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 28px 20px;
        flex-shrink: 0;
        border-top: 1px solid rgba(255, 255, 255, 0.04);
      }
      .btn-nav {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: #94a3b8;
        padding: 8px 18px;
        border-radius: 8px;
        font-size: 0.8rem;
        cursor: pointer;
        transition: all 0.15s;
        font-weight: 600;
      }
      .btn-nav:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.09);
        color: #e2e8f0;
      }
      .btn-nav:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }

      .btn-auto {
        background: linear-gradient(135deg, var(--blue), var(--purple));
        border: none;
        color: #fff;
        padding: 8px 16px;
        border-radius: 8px;
        font-size: 0.78rem;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 0 16px rgba(14, 165, 233, 0.2);
        transition: transform 0.15s;
      }
      .btn-auto:hover {
        transform: scale(1.04);
      }

      /* ── DIAGRAM ── */
      #diagram {
        flex: 1;
        position: relative;
        overflow: hidden;
      }

      /* subtle grid */
      #diagram::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(14, 165, 233, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(14, 165, 233, 0.035) 1px, transparent 1px);
        background-size: 44px 44px;
        pointer-events: none;
      }

      #svg-edges {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        pointer-events: none;
      }

      /* ── NODES ── */
      .node {
        position: absolute;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0;
        transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        z-index: 2;
      }
      .node-card {
        background: rgba(13, 20, 38, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 14px;
        padding: 12px 16px;
        text-align: center;
        min-width: 105px;
        backdrop-filter: blur(12px);
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
        position: relative;
        overflow: hidden;
        transition:
          border-color 0.35s,
          box-shadow 0.35s,
          transform 0.35s;
      }
      .node-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.08),
          transparent
        );
      }
      .node-icon {
        font-size: 1.4rem;
        display: block;
        margin-bottom: 5px;
      }
      .node-title {
        font-size: 0.7rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: #e2e8f0;
        margin-bottom: 1px;
      }
      .node-sub {
        font-size: 0.6rem;
        color: #334155;
      }

      /* ACTIVE node */
      .node.active .node-card {
        transform: scale(1.07);
      }
      .node.active .node-card {
        border-color: var(--node-color) !important;
        box-shadow:
          0 0 0 1px var(--node-color),
          0 0 32px color-mix(in srgb, var(--node-color) 40%, transparent) !important;
      }

      /* DONE node - subtle tint */
      .node.done .node-card {
        border-color: rgba(255, 255, 255, 0.12);
        opacity: 0.7;
      }

      /* ── SVG EDGES ── */
      .e-base {
        fill: none;
        stroke-width: 1.5;
        stroke-dasharray: 6 12;
        stroke-linecap: round;
        opacity: 0.12;
        transition: opacity 0.4s;
      }
      .e-glow {
        fill: none;
        stroke-width: 2.5;
        stroke-dasharray: 8 14;
        stroke-linecap: round;
        opacity: 0;
        transition: opacity 0.4s;
        filter: url(#glow);
      }
      .e-glow.flowing {
        opacity: 1;
        animation: flow-line 0.9s linear infinite;
      }
      @keyframes flow-line {
        from {
          stroke-dashoffset: 0;
        }
        to {
          stroke-dashoffset: -22;
        }
      }

      /* ── LABEL OVERLAY ── */
      .edge-tag {
        position: absolute;
        transform: translate(-50%, -50%);
        font-size: 0.58rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        padding: 2px 7px;
        border-radius: 4px;
        pointer-events: none;
        z-index: 3;
        opacity: 0;
        transition: opacity 0.3s;
      }
      .edge-tag.show {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- ══════ LEFT PANEL ══════ -->
      <div id="panel">
        <div id="panel-header">
          <div class="panel-logo">Tap2Med <span>· Architecture</span></div>
          <div class="panel-sub">Patient Journey Walkthrough</div>
        </div>

        <div id="step-dots"></div>

        <div id="story">
          <div class="step-num">
            <span id="step-label">Step 1 of 14</span>
          </div>
          <div id="step-title">—</div>

          <div id="patient-action">
            <div class="pa-avatar">🙂</div>
            <div>
              <div class="pa-name">Priya Sharma · Token #7</div>
              <div class="pa-text" id="pa-text">—</div>
            </div>
          </div>

          <div id="tech-detail">—</div>
          <div id="code-block" class="hidden"></div>
          <div id="highlight-box" class="hidden"></div>
        </div>

        <div id="prog-wrap">
          <div id="prog-bar-bg"><div id="prog-bar-fill"></div></div>
        </div>

        <div id="nav">
          <button class="btn-nav" id="btn-prev" onclick="go(-1)" disabled>
            ← Prev
          </button>
          <button class="btn-auto" id="btn-auto" onclick="toggleAuto()">
            ▶ Auto
          </button>
          <button class="btn-nav" id="btn-next" onclick="go(1)">Next →</button>
        </div>
      </div>

      <!-- ══════ DIAGRAM ══════ -->
      <div id="diagram">
        <svg id="svg-edges">
          <defs>
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="4" result="blur" />
              <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>
          <!-- paths injected by JS -->
        </svg>
      </div>
    </div>

    <script>
      /* ═════════════════════════════════════════
   NODE DEFINITIONS
═════════════════════════════════════════ */
      const NODES = [
        {
          id: "patient",
          cx: 50,
          cy: 8,
          color: "#0ea5e9",
          icon: "📱",
          title: "Patient",
          sub: "Priya Sharma",
        },
        {
          id: "scan",
          cx: 50,
          cy: 23,
          color: "#6366f1",
          icon: "🔍",
          title: "QR Scan",
          sub: "/scan entry",
        },
        {
          id: "api",
          cx: 50,
          cy: 40,
          color: "#f59e0b",
          icon: "⚡",
          title: "FastAPI",
          sub: "Backend API",
        },
        {
          id: "rate",
          cx: 17,
          cy: 58,
          color: "#ef4444",
          icon: "🚫",
          title: "Rate Guard",
          sub: "5 req/IP/hr",
        },
        {
          id: "hmac",
          cx: 50,
          cy: 58,
          color: "#a855f7",
          icon: "🔐",
          title: "HMAC Engine",
          sub: "SHA-256",
        },
        {
          id: "auth",
          cx: 83,
          cy: 58,
          color: "#10b981",
          icon: "🔑",
          title: "Auth / OTP",
          sub: "PBKDF2 200k",
        },
        {
          id: "db",
          cx: 50,
          cy: 76,
          color: "#06b6d4",
          icon: "🗄️",
          title: "PostgreSQL",
          sub: "6 tables · JSONB",
        },
        {
          id: "doctor",
          cx: 17,
          cy: 92,
          color: "#0ea5e9",
          icon: "👨‍⚕️",
          title: "Doctor",
          sub: "Rx Dashboard",
        },
        {
          id: "staff",
          cx: 50,
          cy: 92,
          color: "#6366f1",
          icon: "🩺",
          title: "Staff",
          sub: "Queue · Vitals",
        },
        {
          id: "pharmacy",
          cx: 83,
          cy: 92,
          color: "#10b981",
          icon: "💊",
          title: "Pharmacy",
          sub: "Dispense View",
        },
      ];

      const EDGES = [
        { id: "e_p_s", from: "patient", to: "scan", color: "#6366f1" },
        { id: "e_s_a", from: "scan", to: "api", color: "#f59e0b" },
        { id: "e_a_r", from: "api", to: "rate", color: "#ef4444" },
        { id: "e_a_h", from: "api", to: "hmac", color: "#a855f7" },
        { id: "e_a_au", from: "api", to: "auth", color: "#10b981" },
        { id: "e_h_db", from: "hmac", to: "db", color: "#a855f7" },
        { id: "e_au_db", from: "auth", to: "db", color: "#10b981" },
        { id: "e_db_d", from: "db", to: "doctor", color: "#0ea5e9" },
        { id: "e_db_s", from: "db", to: "staff", color: "#6366f1" },
        { id: "e_db_p", from: "db", to: "pharmacy", color: "#10b981" },
      ];

      /* ═════════════════════════════════════════
   WALKTHROUGH STEPS
═════════════════════════════════════════ */
      const STEPS = [
        {
          title: "Priya Sharma arrives at City Clinic",
          pa: "Walks in. No appointment. She sees a QR code on the reception desk.",
          tech: "No paper form. No app download. No account needed. Just a QR code.",
          nodes: ["patient"],
          edges: [],
          highlight: {
            color: "#0ea5e9",
            text: "Zero friction entry — any phone, any browser",
          },
        },
        {
          title: "She scans the QR code",
          pa: "Opens her camera, scans the QR. Her browser loads tap2med.com/scan instantly.",
          tech: "The QR code encodes the Clinic ID. Patient's browser opens /scan with the clinic ID pre-filled. No app store. No login.",
          nodes: ["patient", "scan"],
          edges: ["e_p_s"],
          code: `<span class="c-comment"># QR encodes:</span>
https://tap2med.com/scan?clinic=<span class="c-val">3f7a9c12...</span>`,
        },
        {
          title: "Phone number submitted to backend",
          pa: 'Priya types her number: 9876543210. Hits "Check In".',
          tech: "POST /api/events/visit/start — phone number travels encrypted over HTTPS. This is the only moment the raw phone number exists.",
          nodes: ["scan", "api"],
          edges: ["e_s_a"],
          code: `<span class="c-comment"># HTTP POST body:</span>
{
  <span class="c-str">"phone"</span>: <span class="c-val">"9876543210"</span>,
  <span class="c-str">"clinic_id"</span>: <span class="c-val">"3f7a9c12..."</span>
}`,
        },
        {
          title: "Rate limiter checks her IP",
          pa: "The server silently verifies she isn't being abused.",
          tech: "A sliding-window counter checks her IP: max 5 registration attempts per hour. Blocks brute-force patient enumeration. Returns HTTP 429 if exceeded.",
          nodes: ["api", "rate"],
          edges: ["e_a_r"],
          code: `<span class="c-comment"># events.py</span>
records[ip] = [ts <span class="c-key">for</span> ts <span class="c-key">in</span> window <span class="c-key">if</span> age < <span class="c-val">3600</span>]
<span class="c-key">if</span> len(records[ip]) >= <span class="c-val">5</span>:
    <span class="c-key">raise</span> HTTPException(<span class="c-val">429</span>)`,
        },
        {
          title: "HMAC engine receives the phone",
          pa: "The phone number is passed to the cryptographic hashing layer.",
          tech: "hashing.py begins. Three independent HMAC-SHA256 operations run. Each uses a different secret — LOOKUP_SECRET, SECRET_KEY, and SECRET_KEY+clinic_salt.",
          nodes: ["api", "hmac"],
          edges: ["e_a_h"],
          highlight: {
            color: "#a855f7",
            text: "HMAC-SHA256: a one-way mathematical function. No reverse. No lookup table.",
          },
        },
        {
          title: "Three irreversible tokens generated",
          pa: "In milliseconds, three unique tokens are derived from Priya's phone number.",
          tech: "Each token serves a different purpose. The HMAC function cannot be reversed — even with full database access, the phone number cannot be recovered.",
          nodes: ["hmac"],
          edges: [],
          code: `<span class="c-comment"># lookup_hash — lost device recovery only</span>
HMAC(LOOKUP_SECRET, <span class="c-str">"9876543210:0"</span>)
<span class="c-result">→ a3f8c2d1e9b7...</span>

<span class="c-comment"># network_token — across all clinics</span>
HMAC(SECRET_KEY, <span class="c-str">"9876543210:0:{user_salt}"</span>)
<span class="c-result">→ 7b9e4f2a1c8d...</span>

<span class="c-comment"># local_token — this clinic only</span>
HMAC(SECRET_KEY+<span class="c-val">clinic_salt</span>, <span class="c-str">"9876543210:0"</span>)
<span class="c-result">→ c1d5a8e3f2b9...</span>`,
        },
        {
          title: "Phone number deleted from memory",
          pa: "Before anything is saved — Priya's phone number is wiped.",
          tech: "The plaintext phone number is explicitly overwritten in memory. It never reaches the database. This is a hard guarantee, not a policy.",
          nodes: ["hmac"],
          edges: [],
          code: `<span class="c-comment"># events.py — immediately after hashing</span>
payload.phone = <span class="c-del">"9876543210"</span> → <span class="c-str">"DELETED"</span>
phone         = <span class="c-del">"9876543210"</span> → <span class="c-str">"DELETED"</span>

<span class="c-comment"># PostgreSQL receives: zero phone numbers</span>`,
          highlight: {
            color: "#ef4444",
            text: "Mathematical guarantee — phone does not exist in the database. Ever.",
          },
        },
        {
          title: "Tokens stored in PostgreSQL",
          pa: "The hashed tokens are saved. Priya now has a patient record.",
          tech: "patients table: lookup_hash + user_salt + network_token. clinic_patient_records: local_token + name. Events table: new row with status=waiting, token #7 assigned.",
          nodes: ["hmac", "db"],
          edges: ["e_h_db"],
          code: `<span class="c-comment"># patients table — zero PII</span>
lookup_hash:   <span class="c-val">a3f8c2d1...</span>
network_token: <span class="c-val">7b9e4f2a...</span>
user_salt:     <span class="c-val">random_32_bytes</span>

<span class="c-comment"># events table</span>
local_token: <span class="c-val">c1d5a8e3...</span>, status: <span class="c-str">"waiting"</span>
daily_token_number: <span class="c-val">7</span>`,
        },
        {
          title: "Priya appears in the staff queue",
          pa: '"Token #7 — Priya Sharma" appears on the staff dashboard. She doesn\'t need to tell anyone her number.',
          tech: "Staff dashboard polls /api/events/queue with clinic_id. Returns events where status=waiting, sorted by timestamp. No phone number returned — only name and token.",
          nodes: ["db", "staff"],
          edges: ["e_db_s"],
          highlight: {
            color: "#6366f1",
            text: "Queue position: 1 · Estimated wait: 0 mins · Visit type: Walk-in",
          },
        },
        {
          title: "Nurse records vitals",
          pa: 'Nurse calls "Token 7". Records BP, weight, SpO2 — all linked to Priya\'s local_token.',
          tech: "PUT /api/events/vitals — vitals stored as JSONB in the events row. Flexible schema means new parameters can be added without database migration.",
          nodes: ["staff"],
          edges: [],
          code: `<span class="c-comment"># Stored as JSONB — no schema change needed</span>
vitals: {
  <span class="c-str">"bp_sys"</span>: <span class="c-val">"120"</span>, <span class="c-str">"bp_dia"</span>: <span class="c-val">"80"</span>,
  <span class="c-str">"wt"</span>: <span class="c-val">"62"</span>, <span class="c-str">"spo2"</span>: <span class="c-val">"98"</span>,
  <span class="c-str">"temp"</span>: <span class="c-val">"98.6"</span>, <span class="c-str">"is_paid"</span>: <span class="c-key">true</span>
}`,
        },
        {

          pa: "Doctor clicks Token #7. Priya's full history loads instantly — past visits, all prescriptions.",
          tech: "GET /api/events/history/{local_token}?clinic_id=... — returns all completed visits with prescriptions, vitals, diagnosis. Local_token scopes results to this clinic only.",
          nodes: ["db", "doctor"],
          edges: ["e_db_d"],
          highlight: {
            color: "#0ea5e9",
            text: "Previous visit: 12 Aug 2026 · Dx: URTI · Rx: Azithromycin 500mg",
          },
        },
        {
          title: "Doctor writes the prescription",
          pa: "Diagnosis: Hypertension Stage 1. Prescribes Amlodipine 5mg.",
          tech: "Doctor fills the prescription pad on the dashboard — type, medicine name, dosage, frequency, duration. All stored structured in the prescriptions table.",
          nodes: ["doctor"],
          edges: [],
          code: `<span class="c-comment"># prescriptions table row</span>
medicine_name: <span class="c-str">"TAB. Amlodipine"</span>
instructions:  <span class="c-str">"5mg · 1-0-0 · After Food · 30 Days"</span>
drug_category: <span class="c-str">"MEDICINE"</span>
event_id:      <span class="c-val">uuid → links to this visit</span>`,
        },
        {
          title: "Pharmacy notified in real time",
          pa: "Pharmacist's screen updates. Priya's Rx appears — medicine, dose, instructions.",
          tech: "PUT /api/events/complete saves prescriptions, sets event status=completed. Pharmacy dashboard polls queue, sees the completed event, renders Rx details.",
          nodes: ["db", "pharmacy"],
          edges: ["e_db_p"],
          highlight: {
            color: "#10b981",
            text: "TAB. Amlodipine 5mg · 1-0-0 After Food · 30 Days · ✓ Dispensed",
          },
        },
        {
          title: "Visit complete. Zero phone numbers stored.",
          pa: '"See you in a month, Priya." — Visit ends. Everything is recorded. Nothing sensitive is exposed.',
          tech: "Priya's phone: 9876543210 exists nowhere in the database. No column, no log, no cache. The system has full medical history with zero PII liability.",
          nodes: [
            "patient",
            "scan",
            "api",
            "rate",
            "hmac",
            "auth",
            "db",
            "doctor",
            "staff",
            "pharmacy",
          ],
          edges: [
            "e_p_s",
            "e_s_a",
            "e_a_r",
            "e_a_h",
            "e_a_au",
            "e_h_db",
            "e_au_db",
            "e_db_d",
            "e_db_s",
            "e_db_p",
          ],
          highlight: {
            color: "#10b981",
            text: "✓ Full medical record · ✓ Repeat-patient detected · ✓ Phone: never stored",
          },
        },
      ];

      /* ═════════════════════════════════════════
   BUILD DOM
═════════════════════════════════════════ */
      const diagramEl = document.getElementById("diagram");
      const svgEl = document.getElementById("svg-edges");
      const nodeEls = {};

      function px(pct, total) {
        return (total * pct) / 100;
      }
      function dw() {
        return diagramEl.offsetWidth;
      }
      function dh() {
        return diagramEl.offsetHeight;
      }

      function buildNodes() {
        // remove old
        document.querySelectorAll(".node").forEach((e) => e.remove());

        NODES.forEach((n) => {
          const div = document.createElement("div");
          div.className = "node";
          div.id = "n-" + n.id;
          div.style.setProperty("--node-color", n.color);
          div.style.left = px(n.cx, dw()) + "px";
          div.style.top = px(n.cy, dh()) + "px";
          div.innerHTML = `
      <div class="node-card">
        <span class="node-icon">${n.icon}</span>
        <div class="node-title">${n.title}</div>
        <div class="node-sub">${n.sub}</div>
      </div>`;
          diagramEl.appendChild(div);
          nodeEls[n.id] = div;
        });
      }

      /* ═════════════════════════════════════════
   BUILD SVG EDGES
═════════════════════════════════════════ */
      function nodeCenter(id) {
        const el = nodeEls[id];
        if (!el) return { x: 0, y: 0 };
        const dr = diagramEl.getBoundingClientRect();
        const er = el.getBoundingClientRect();
        return {
          x: er.left + er.width / 2 - dr.left,
          y: er.top + er.height / 2 - dr.top,
        };
      }

      // returns top/bottom attachment point
      function nodePort(id, side) {
        const el = nodeEls[id];
        if (!el) return { x: 0, y: 0 };
        const dr = diagramEl.getBoundingClientRect();
        const er = el.getBoundingClientRect();
        const cx = er.left + er.width / 2 - dr.left;
        const top = er.top - dr.top;
        const bot = er.bottom - dr.top;
        return { x: cx, y: side === "top" ? top : bot };
      }

      function buildEdges() {
        // clear old paths
        svgEl.querySelectorAll(".e-base,.e-glow").forEach((e) => e.remove());
        document.querySelectorAll(".edge-tag").forEach((e) => e.remove());

        EDGES.forEach((edge) => {
          const s = nodePort(edge.from, "bottom");
          const e = nodePort(edge.to, "top");

          // control points for cubic bezier — vertical tangents
          const dy = Math.abs(e.y - s.y);
          const tension = Math.min(dy * 0.5, 80);

          const d = `M ${s.x} ${s.y} C ${s.x} ${s.y + tension} ${e.x} ${e.y - tension} ${e.x} ${e.y}`;

          // base (dim, always visible)
          const base = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path",
          );
          base.setAttribute("d", d);
          base.setAttribute("class", "e-base");
          base.setAttribute("stroke", edge.color);
          base.id = "base-" + edge.id;
          svgEl.appendChild(base);

          // glow layer (animated when active)
          const glow = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path",
          );
          glow.setAttribute("d", d);
          glow.setAttribute("class", "e-glow");
          glow.setAttribute("stroke", edge.color);
          glow.id = "glow-" + edge.id;
          svgEl.appendChild(glow);
        });
      }

      /* ═════════════════════════════════════════
   STEP RENDERING
═════════════════════════════════════════ */
      let currentStep = 0;
      let autoTimer = null;
      let progTimer = null;
      let progPct = 0;
      const AUTO_DURATION = 5000;

      function renderStep(idx) {
        const step = STEPS[idx];

        // dots
        const dots = document.querySelectorAll(".dot");
        dots.forEach((d, i) => {
          d.classList.toggle("active", i === idx);
          d.classList.toggle("done", i < idx);
        });

        // step label
        document.getElementById("step-label").textContent =
          `Step ${idx + 1} of ${STEPS.length}`;
        document.getElementById("step-title").textContent = step.title;
        document.getElementById("pa-text").textContent = step.pa;
        document.getElementById("tech-detail").textContent = step.tech;

        // code block
        const cb = document.getElementById("code-block");
        if (step.code) {
          cb.innerHTML = step.code;
          cb.classList.remove("hidden");
        } else {
          cb.classList.add("hidden");
        }

        // highlight
        const hb = document.getElementById("highlight-box");
        if (step.highlight) {
          hb.style.background = step.highlight.color + "18";
          hb.style.borderColor = step.highlight.color + "55";
          hb.style.color = step.highlight.color;
          hb.textContent = step.highlight.text;
          hb.classList.remove("hidden");
        } else {
          hb.classList.add("hidden");
        }

        // node states
        NODES.forEach((n) => {
          const el = nodeEls[n.id];
          if (!el) return;
          el.classList.remove("active", "done");
          if (step.nodes.includes(n.id)) el.classList.add("active");
          else {
            // check if node was in any previous step
            const prevActive = STEPS.slice(0, idx).some((s) =>
              s.nodes.includes(n.id),
            );
            if (prevActive) el.classList.add("done");
          }
        });

        // edge states
        EDGES.forEach((edge) => {
          const glow = document.getElementById("glow-" + edge.id);
          const base = document.getElementById("base-" + edge.id);
          if (!glow || !base) return;
          const active = step.edges.includes(edge.id);
          glow.classList.toggle("flowing", active);
          if (base) base.style.opacity = active ? "0.3" : "0.12";
        });

        // nav buttons
        document.getElementById("btn-prev").disabled = idx === 0;
        document.getElementById("btn-next").disabled = idx === STEPS.length - 1;
      }

      function go(dir) {
        const next = currentStep + dir;
        if (next < 0 || next >= STEPS.length) return;
        currentStep = next;
        renderStep(currentStep);
        if (autoTimer) resetProgress();
      }

      /* ═════════════════════════════════════════
   AUTO ADVANCE
═════════════════════════════════════════ */
      function startProgress() {
        progPct = 0;
        clearInterval(progTimer);
        const step = 50; // ms
        progTimer = setInterval(() => {
          progPct += (step / AUTO_DURATION) * 100;
          document.getElementById("prog-bar-fill").style.width =
            Math.min(progPct, 100) + "%";
          if (progPct >= 100) {
            clearInterval(progTimer);
            if (currentStep < STEPS.length - 1) {
              go(1);
              startProgress();
            } else {
              stopAuto();
            }
          }
        }, step);
      }

      function resetProgress() {
        progPct = 0;
        document.getElementById("prog-bar-fill").style.width = "0%";
        clearInterval(progTimer);
        if (autoTimer) startProgress();
      }

      function startAuto() {
        autoTimer = true;
        document.getElementById("btn-auto").textContent = "⏸ Pause";
        document.getElementById("btn-auto").style.background =
          "linear-gradient(135deg,#475569,#334155)";
        startProgress();
      }

      function stopAuto() {
        autoTimer = null;
        clearInterval(progTimer);
        document.getElementById("btn-auto").textContent = "▶ Auto";
        document.getElementById("btn-auto").style.background =
          "linear-gradient(135deg,#0ea5e9,#6366f1)";
        document.getElementById("prog-bar-fill").style.width = "0%";
      }

      function toggleAuto() {
        if (autoTimer) stopAuto();
        else startAuto();
      }

      /* ═════════════════════════════════════════
   DOTS
═════════════════════════════════════════ */
      function buildDots() {
        const container = document.getElementById("step-dots");
        container.innerHTML = "";
        STEPS.forEach((_, i) => {
          const d = document.createElement("div");
          d.className = "dot";
          d.title = `Step ${i + 1}`;
          d.onclick = () => {
            currentStep = i;
            renderStep(i);
            if (autoTimer) resetProgress();
          };
          container.appendChild(d);
        });
      }

      /* ═════════════════════════════════════════
   INIT + RESIZE
═════════════════════════════════════════ */
      function init() {
        buildNodes();
        // wait one frame for layout
        requestAnimationFrame(() => {
          buildEdges();
          buildDots();
          renderStep(0);
        });
      }

      window.addEventListener("resize", () => {
        // reposition nodes
        NODES.forEach((n) => {
          const el = nodeEls[n.id];
          if (el) {
            el.style.left = px(n.cx, dw()) + "px";
            el.style.top = px(n.cy, dh()) + "px";
          }
        });
        // rebuild edges after layout
        requestAnimationFrame(buildEdges);
      });

      // keyboard navigation
      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight" || e.key === " ") go(1);
        if (e.key === "ArrowLeft") go(-1);
      });

      init();
    </script>
  </body>
</html>
