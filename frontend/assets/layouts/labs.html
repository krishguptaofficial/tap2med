<!-- Expanded Lab Flowsheet Modal for Staff -->
<div id="labs-modal" class="backdrop">
  <div class="labs-modal-container">
    <div class="labs-modal-header">
      <div>
        <h3 style="margin: 0; font-size: 20px; color: var(--primary-color)">
          Lab Flowsheet & Trends
        </h3>
        <span
          style="font-size: 13px; color: var(--text-muted); font-weight: 600"
          id="lab-modal-patient-name"
          >Patient Name</span
        >
        <input type="hidden" id="lab-local-token" />
      </div>
      <button
        onclick="closeLabsModal()"
        style="
          background: none;
          border: none;
          font-size: 24px;
          cursor: pointer;
          color: #94a3b8;
        "
      >
        &times;
      </button>
    </div>
    <div class="labs-modal-body">
      <div class="labs-entry-section">
        <div
          style="
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
            align-items: center;
            justify-content: space-between;
          "
        >
          <div style="display: flex; gap: 8px; flex: 1; align-items: center">
            <input
              type="date"
              id="lab-date"
              class="input"
              style="max-width: 160px"
              onchange="
                if (window.Tap2MedLabs)
                  window.Tap2MedLabs.populateInputsForDate(this.value);
                else populateLabInputsForDate(this.value);
              "
            />
            <button
              id="btn-save-labs"
              onclick="
                if (window.Tap2MedLabs) window.Tap2MedLabs.saveLabs();
                else saveLabs();
              "
              class="btn btn-primary"
              style="white-space: nowrap; font-weight: 700"
            >
              Save Values
            </button>
          </div>
          <button
            type="button"
            onclick="
              if (window.Tap2MedLabs) window.Tap2MedLabs.showCustomCreator();
            "
            class="btn"
            style="
              background: #f0f9ff;
              color: #0284c7;
              border: 1.5px dashed #0284c7;
              font-weight: 700;
              font-size: 12px;
              display: flex;
              align-items: center;
              gap: 6px;
              padding: 6px 14px;
              border-radius: 6px;
              cursor: pointer;
              white-space: nowrap;
            "
          >
            <span>✨</span> + Add Custom Test
          </button>
        </div>

        <!-- SMART TEST & CATEGORY SEARCH WITH AUTOCOMPLETE DROPDOWN -->
        <div
          style="position: relative; margin-bottom: 16px"
          class="lab-search-container"
        >
          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: center;
              margin-bottom: 6px;
            "
          >
            <label
              for="lab-search-input"
              style="
                font-size: 12px;
                font-weight: 700;
                color: #475569;
                margin: 0;
              "
              >🔍 Search standard tests or specialty heading</label
            >
            <span style="font-size: 11px; color: #0284c7; font-weight: 600"
              >Category Filter:</span
            >
          </div>
          <div style="display: flex; gap: 8px">
            <input
              type="text"
              id="lab-search-input"
              class="input"
              style="flex: 1.8; font-size: 13px"
              placeholder="e.g. CBC, Zinc, Thyroid, Haematology, Troponin..."
              oninput="
                if (window.Tap2MedLabs)
                  window.Tap2MedLabs.handleSearchInput(this.value);
                else filterLabFields();
              "
              onfocus="
                if (window.Tap2MedLabs) window.Tap2MedLabs.openSearchDropdown();
              "
              autocomplete="off"
            />
            <select
              id="lab-category-filter"
              class="input"
              style="
                flex: 1.2;
                background: white;
                font-size: 12px;
                font-weight: 600;
              "
              onchange="
                if (window.Tap2MedLabs)
                  window.Tap2MedLabs.selectCategoryHeading(this.value);
                else if (window.onLabCategoryChange)
                  window.onLabCategoryChange(this.value);
              "
            >
              <option value="">All Categories ▾</option>
              <option value="Haematology">Haematology</option>
              <option value="Diabetes & Glycemic">Diabetes & Glycemic</option>
              <option value="Bio Chemistry">Bio Chemistry</option>
              <option value="Liver Function (LFT)">Liver Function (LFT)</option>
              <option value="Kidney Function (KFT)">
                Kidney Function (KFT)
              </option>
              <option value="Lipid Profile">Lipid Profile</option>
              <option value="Thyroid Profile">Thyroid Profile</option>
              <option value="Cardiac Markers">Cardiac Markers</option>
              <option value="Hormones & Endocrine">Hormones & Endocrine</option>
              <option value="Vitamins & Minerals">Vitamins & Minerals</option>
              <option value="Infectious & Serology">
                Infectious & Serology
              </option>
              <option value="Urine & Stool">Urine & Stool</option>
              <option value="Radiology & Imaging">Radiology & Imaging</option>
              <option value="Other Investigations">Others</option>
            </select>
          </div>

          <!-- Floating Autocomplete Dropdown Attached Directly to Search Bar -->
          <div
            id="lab-search-dropdown"
            style="
              display: none;
              position: absolute;
              top: 100%;
              left: 0;
              right: 0;
              z-index: 10050;
              margin-top: 4px;
              background: white;
              border: 1px solid #cbd5e1;
              border-radius: 8px;
              box-shadow:
                0 10px 25px -5px rgba(0, 0, 0, 0.15),
                0 8px 10px -6px rgba(0, 0, 0, 0.1);
              overflow: hidden;
            "
          ></div>
        </div>

        <!-- ADDED & CUSTOM INVESTIGATIONS -->
        <div
          id="dynamic-lab-section"
          style="display: none; margin-bottom: 20px"
        >
          <div
            class="lab-section-header"
            style="
              background: #f0f9ff;
              border-left: 4px solid #0284c7;
              padding: 8px 12px;
              font-weight: 800;
              font-size: 13px;
              margin-bottom: 10px;
              display: flex;
              justify-content: space-between;
              align-items: center;
              border-radius: 0 6px 6px 0;
            "
          >
            <span
              style="
                color: #0369a1;
                display: flex;
                align-items: center;
                gap: 6px;
              "
            >
              <span>⭐</span> Added & Custom Investigations
            </span>
            <span
              id="dynamic-tests-count-badge"
              style="
                font-size: 11px;
                background: white;
                color: #0284c7;
                padding: 2px 8px;
                border-radius: 12px;
                border: 1px solid #bae6fd;
                font-weight: 700;
              "
              >0 Added</span
            >
          </div>
          <div class="lab-grid" id="dynamic-lab-grid">
            <!-- Dynamically added tests will be rendered here -->
          </div>
        </div>

        <!-- DIABETES PROFILE -->
        <div
          class="lab-section-header"
          style="
            background: #e2e8f0;
            padding: 8px 12px;
            font-weight: 800;
            font-size: 13px;
            margin-bottom: 10px;
          "
        >
          Diabetes Profile
        </div>
        <div class="lab-grid">
          <div class="lab-input-group">
            <label>Serum Alkaline Phosphatase (IU/L)</label
            ><input
              type="number"
              id="lab-diab_sap"
              class="input"
              onkeyup="checkRange(this)"
            />
          </div>
          <div class="lab-input-group">
            <label>Fasting Blood Sugar (FBS) (mg/dL)</label
            ><input
              type="number"
              id="lab-diab_fbs"
              class="input"
              data-min="70"
              data-max="99"
              onkeyup="checkRange(this)"
            />
          </div>
          <div class="lab-input-group">
            <label>Glycosylated Haemoglobin - HbA1c (%)</label
            ><input
              type="number"
              step="0.1"
              id="lab-diab_hba1c"
              class="input"
              data-min="4.0"
              data-max="5.6"
              onkeyup="checkRange(this)"
            />
          </div>
          <div class="lab-input-group">
            <label>Serum Creatinine (mg/dL)</label
            ><input
              type="number"
              step="0.1"
              id="lab-diab_creat"
              class="input"
              data-min="0.6"
              data-max="1.2"
              onkeyup="checkRange(this)"
            />
          </div>
          <div class="lab-input-group">
            <label>eGFR - Creatinine Clearance (mL/min/1.73m2)</label
            ><input
              type="number"
              step="0.1"
              id="lab-diab_egfr"
              class="input"
              onkeyup="checkRange(this)"
            />
          </div>
          <div class="lab-input-group">
            <label>Spot Albumin Creatinine Ratio (mg/g)</label
            ><input
              type="number"
              step="0.1"
              id="lab-diab_sacr"
              class="input"
              onkeyup="checkRange(this)"
            />
          </div>
          <div class="lab-input-group">
            <label>Total Cholesterol (mg/dL)</label
            ><input
              type="number"
              id="lab-diab_chol"
              class="input"
              data-max="200"
              onkeyup="checkRange(this)"
            />
          </div>
          <div class="lab-input-group">
            <label>Serum Triglycerides (mg/dL)</label
            ><input
              type="number"
              id="lab-diab_tg"
              class="input"
              data-max="150"
              onkeyup="checkRange(this)"
            />
          </div>
          <div class="lab-input-group">
            <label>Serum LDL Cholesterol (mg/dL)</label
            ><input
              type="number"
              id="lab-diab_ldl"
              class="input"
              data-max="100"
              onkeyup="checkRange(this)"
            />
          </div>
          <div class="lab-input-group">
            <label>Serum HDL Cholesterol (mg/dL)</label
            ><input
              type="number"
              id="lab-diab_hdl"
              class="input"
              data-min="40"
              onkeyup="checkRange(this)"
            />
          </div>
        </div>

        <!-- HAEMATOLOGY -->

          <div class="lab-input-group">
            <label>Basophils (%)</label
            ><input
              type="number"
              id="lab-haem_baso"
              class="input"
              onkeyup="checkRange(this)"
            />
          </div>
          <div class="lab-input-group">
            <label>RBC - Red Blood Cells (millions/cu mm)</label

            <label>RBCs (-)</label
            ><input type="text" id="lab-haem_rbcs" class="input" />
          </div>
          <div class="lab-input-group">
            <label>WBCs (thousand cells/µL)</label
            ><input
              type="number"
              step="0.1"
              id="lab-haem_wbcs"
              class="input"
              onkeyup="checkRange(this)"

          </div>
          <div class="lab-input-group">
            <label>Platelets (-)</label

          </div>
          <div class="lab-input-group">
            <label
              >Mean Corpuscular Haemoglobin Concentration (MCHC) (g/dL)</label

              type="number"
              step="0.1"
              id="lab-haem_mchc"
              class="input"
              onkeyup="checkRange(this)"
            />
          </div>
        </div>

        <!-- BIO CHEMISTRY -->
        <div
          class="lab-section-header"
          style="
            background: #e2e8f0;
            padding: 8px 12px;
            font-weight: 800;
            font-size: 13px;
            margin-bottom: 10px;
            margin-top: 20px;
          "
        >

        </div>

          <div class="lab-input-group">
            <label>Fasting Urine Sugar (FUS) (-)</label

          </div>

              id="lab-bio_ppbs"

            />
          </div>
          <div class="lab-input-group">
            <label>Post Prandial Urine Sugar - PPUS (-)</label
            ><input type="text" id="lab-bio_ppus" class="input" />
          </div>
          <div class="lab-input-group">
            <label>Mean Blood Glucose (Calculated from HbA1c) (mg/dL)</label

              id="lab-bio_mbg"

        <!-- UACR -->

            background: #e2e8f0;
