<!-- Expanded Lab Flowsheet Modal for Staff -->
    <div id="labs-modal" class="backdrop">
      <div class="labs-modal-container">
        <div class="labs-modal-header">
          <div>
            <h3 style="margin: 0; font-size: 20px; color: var(--primary-color)">
              Lab Flowsheet & Trends
            </h3>
            <span
              style="
                font-size: 13px;
                color: var(--text-muted);
                font-weight: 600;
              "
              id="lab-modal-patient-name"
              >Patient Name</span
            >
            <input type="hidden" id="lab-local-token" />
          </div>
          <button
            onclick="closeLabsModal()"
            style="
              background: none;
              border: none;
              font-size: 24px;
              cursor: pointer;
              color: #94a3b8;
            "
          >
            &times;
          </button>
        </div>
        <div class="labs-modal-body">
          <div class="labs-entry-section">
            <div style="display: flex; gap: 10px; margin-bottom: 20px">
              <input
                type="date"
                id="lab-date"
                class="input"
                style="flex: 1"
                onchange="populateLabInputsForDate(this.value)"
              />
              <button onclick="saveLabs()" class="btn btn-primary">
                Save Values
              </button>
            </div>
            <div style="margin-bottom: 16px">
              <label
                for="lab-search-input"
                style="
                  display: block;
                  margin-bottom: 8px;
                  font-size: 12px;
                  font-weight: 700;
                  color: var(--text-muted);
                "
                >Search tests</label
              >
              <input
                type="text"
                id="lab-search-input"
                class="input"
                placeholder="Search by test name or code"
                oninput="filterLabFields()"
              />
            </div>

            <!-- DIABETES PROFILE -->
            <div
              class="lab-section-header"
              style="
                background: #e2e8f0;
                padding: 8px 12px;
                font-weight: 800;
                font-size: 13px;
                margin-bottom: 10px;
              "
            >
              Diabetes Profile
            </div>
            <div class="lab-grid">
              <div class="lab-input-group">
                <label>Serum Alkaline Phosphatase (IU/L)</label
                ><input
                  type="number"
                  id="lab-diab_sap"
                  class="input"
                  onkeyup="checkRange(this)"
                />
              </div>
              <div class="lab-input-group">
                <label>Fasting Blood Sugar (FBS) (mg/dL)</label
                ><input
                  type="number"
                  id="lab-diab_fbs"
                  class="input"
                  data-min="70"
                  data-max="99"
                  onkeyup="checkRange(this)"
                />
              </div>
              <div class="lab-input-group">
                <label>Glycosylated Haemoglobin - HbA1c (%)</label
                ><input
                  type="number"
                  step="0.1"
                  id="lab-diab_hba1c"
                  class="input"
                  data-min="4.0"
                  data-max="5.6"
                  onkeyup="checkRange(this)"
                />
              </div>
              <div class="lab-input-group">
                <label>Serum Creatinine (mg/dL)</label
                ><input
                  type="number"
                  step="0.1"
                  id="lab-diab_creat"
                  class="input"
                  data-min="0.6"
                  data-max="1.2"
                  onkeyup="checkRange(this)"
                />
              </div>
              <div class="lab-input-group">
                <label>eGFR - Creatinine Clearance (mL/min/1.73m2)</label
                ><input
                  type="number"
                  step="0.1"
                  id="lab-diab_egfr"
                  class="input"
                  onkeyup="checkRange(this)"
                />
              </div>
              <div class="lab-input-group">
                <label>Spot Albumin Creatinine Ratio (mg/g)</label
                ><input
                  type="number"
                  step="0.1"
                  id="lab-diab_sacr"
                  class="input"
                  onkeyup="checkRange(this)"
                />
              </div>
              <div class="lab-input-group">
                <label>Total Cholesterol (mg/dL)</label
                ><input
                  type="number"
                  id="lab-diab_chol"
                  class="input"
                  data-max="200"
                  onkeyup="checkRange(this)"
                />
              </div>
              <div class="lab-input-group">
                <label>Serum Triglycerides (mg/dL)</label
                ><input
                  type="number"
                  id="lab-diab_tg"
                  class="input"
                  data-max="150"
                  onkeyup="checkRange(this)"
                />
              </div>
              <div class="lab-input-group">
                <label>Serum LDL Cholesterol (mg/dL)</label
                ><input
                  type="number"
                  id="lab-diab_ldl"
                  class="input"
                  data-max="100"
                  onkeyup="checkRange(this)"
                />
              </div>
              <div class="lab-input-group">
                <label>Serum HDL Cholesterol (mg/dL)</label
                ><input
                  type="number"
                  id="lab-diab_hdl"
                  class="input"
                  data-min="40"
                  onkeyup="checkRange(this)"
                />
              </div>
            </div>

            <!-- HAEMATOLOGY -->

                  id="lab-haem_wbc"

                  data-max="11000"

                  id="lab-haem_eos"

              <div class="lab-input-group">
                <label>Monocytes (%)</label
                ><input
                  type="number"
                  id="lab-haem_mono"
                  class="input"
                  onkeyup="checkRange(this)"
                />
              </div>
              <div class="lab-input-group">
                <label>Basophils (%)</label
                ><input
                  type="number"
                  id="lab-haem_baso"
                  class="input"
                  onkeyup="checkRange(this)"
                />
              </div>
              <div class="lab-input-group">
                <label>RBC - Red Blood Cells (millions/cu mm)</label

                  type="number"

                  id="lab-haem_rbc"
                  class="input"
                  onkeyup="checkRange(this)"

                <label>RBCs (-)</label

              </div>
              <div class="lab-input-group">
                <label>WBCs (thousand cells/µL)</label
                ><input
                  type="number"
                  step="0.1"
                  id="lab-haem_wbcs"
                  class="input"
                  onkeyup="checkRange(this)"
                />
              </div>
              <div class="lab-input-group">
                <label>Platelets (-)</label

              </div>
              <div class="lab-input-group">
                <label>Haemoparasites (-)</label

                <label>Impression (-)</label

              <div class="lab-input-group">

            <!-- BIO CHEMISTRY -->

              <div class="lab-input-group">
                <label>Post Prandial Urine Sugar - PPUS (-)</label

                <label>Serum Calcium (mg/dL)</label
                ><input
                  type="number"
                  step="0.1"

                  class="input"

            <!-- LFT -->

              <div class="lab-input-group">

              <div class="lab-input-group">
