<!-- PRINT LAYOUT 1: Prescription Layout -->
    <div id="print-rx-layout" class="print-only">
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: flex-start;
          border-bottom: 2px solid #0f172a;
          padding-bottom: 20px;
          margin-bottom: 20px;
        "
      >
        <div>
          <h1
            id="print-clinic-name"
            style="
              margin: 0;
              font-size: 28px;
              font-weight: 800;
              color: #0f172a;
              letter-spacing: -0.02em;
            "
          >
            Clinic Name
          </h1>
          <p style="margin: 5px 0 0; font-size: 14px; color: #475569">
            Digital Prescription
          </p>
        </div>
        <div style="text-align: right">
          <h2
            id="print-doctor-name"
            style="margin: 0; font-size: 18px; font-weight: 700; color: #0f172a"
          >
            Doctor Name
          </h2>
          <p
            id="print-date"
            style="margin: 4px 0 0; font-size: 14px; color: #475569"
          >
            Date:
          </p>
        </div>
      </div>
      <div
        style="
          display: flex;
          gap: 20px;
          margin-bottom: 30px;
          font-size: 14px;
          border-bottom: 1px solid #f1f5f9;
          padding-bottom: 15px;
          color: #334155;
        "
      >
        <div style="flex: 2" id="print-patient-name">
          <strong>Name:</strong> Patient
        </div>
        <div style="flex: 1; text-align: right" id="print-patient-id">
          <strong>Patient ID:</strong> --
        </div>
      </div>
      <div
        id="print-clinical-notes"
        style="
          margin-bottom: 25px;
          display: none;
          padding-bottom: 15px;
          border-bottom: 1px dashed #cbd5e1;
        "
      >
        <div
          id="print-complaints"
          style="margin-bottom: 10px; font-size: 14px"
        ></div>
        <div
          id="print-diagnosis"
          style="font-size: 14px; font-weight: bold; color: #0f172a"
        ></div>
      </div>
      <div style="margin-bottom: 25px">
        <span
          style="
            font-size: 36px;
            font-weight: bold;
            font-family: &quot;Times New Roman&quot;, serif;
            color: #0f172a;
          "
          >&#8471;</span
        >
      </div>
      <div id="print-medicines" style="min-height: 250px"></div>
      <div
        id="print-tests"
        style="
          margin-top: 20px;
          padding-top: 20px;
          border-top: 1px dashed #cbd5e1;
          font-size: 14px;
          display: none;
        "
      ></div>
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: flex-end;
          margin-top: 40px;
          padding-top: 20px;
          border-top: 1px solid #e2e8f0;
        "
      >
        <div style="font-size: 12px; color: #64748b">
          <strong>Powered by Tap2Med</strong><br />Smart Clinic Network
        </div>
        <div style="text-align: center; width: 200px">
          <div
            style="
              border-bottom: 1px solid #0f172a;
              height: 40px;
              margin-bottom: 8px;
            "
          ></div>
          <span style="font-size: 14px; color: #0f172a; font-weight: 600"
            >Doctor's Signature</span
          >
        </div>
      </div>
    </div>
